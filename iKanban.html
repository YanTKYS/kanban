<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iKanban</title>
<style>
  /* ============================================================
     テーマ変数定義（iKanbanPilot.html と同じ考え方）
     - :root が既定（Light）テーマ
     - html[data-theme="xxx"] で各テーマの値を上書きする
     - レイアウトはテーマ間で共通。配色・境界線・影のみ変化させる
     ============================================================ */
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-alt: #eceef1;
    --text: #1b1f24;
    --text-muted: #5b6470;
    --border: #d0d5dc;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --danger: #b3261e;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
    --dragging-opacity: 0.5;
    --dropzone-bg: #e6edff;
    --insert-line: #2f6fed;
  }

  html[data-theme="dark"] {
    --bg: #14161a;
    --surface: #1f232a;
    --surface-alt: #262b33;
    --text: #eef1f5;
    --text-muted: #9aa3b0;
    --border: #363c46;
    --accent: #6d9bff;
    --accent-text: #10131a;
    --danger: #ff8a80;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    --dropzone-bg: #2a3550;
    --insert-line: #6d9bff;
  }

  html[data-theme="blue"] {
    --bg: #eaf2fb;
    --surface: #ffffff;
    --surface-alt: #dbe9fb;
    --text: #102540;
    --text-muted: #4a6483;
    --border: #b7d2f0;
    --accent: #0b5fcc;
    --accent-text: #ffffff;
    --danger: #a3271a;
    --shadow: 0 1px 2px rgba(11, 95, 204, 0.15);
    --dropzone-bg: #cfe3fb;
    --insert-line: #0b5fcc;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    margin: 0;
  }

  header p.subtitle {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--text-muted);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .theme-switcher {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .theme-switcher label {
    font-size: 13px;
    color: var(--text-muted);
  }

  .theme-switcher select {
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  button {
    font-family: inherit;
  }

  .btn {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }

  .btn:hover {
    border-color: var(--accent);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn:disabled:hover {
    border-color: var(--border);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .btn-xs {
    font-size: 11.5px;
    padding: 3px 8px;
  }

  .btn:focus-visible,
  select:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  .card:focus-visible,
  .card-title-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  main {
    padding: 20px;
    overflow-x: auto;
    overflow-y: hidden;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .board {
    display: flex;
    gap: 16px;
    min-width: 960px;
    flex: 1;
    min-height: 0;
  }

  /* 列自体の高さは .board（main の残り高さ）に合わせて伸縮する。
     カードが増えても列の外枠は伸びず、内側の .card-list だけが
     スクロールする（下部で overflow-y: auto を指定） */
  .column {
    flex: 1 1 0;
    min-width: 240px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
  }

  /* ヘッダーとカード追加領域はスクロールさせない固定部分 */
  .column-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    padding: 4px 4px 12px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  .column-header h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
  }

  .column-title {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    min-width: 0;
  }

  /* 列名の編集ボタン。カード操作（追加・削除）より主張しないよう、
     通常時は控えめな不透明度にし、ホバー・フォーカス時のみ強調する */
  .column-label-edit-btn {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    line-height: 1;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    opacity: 0.55;
  }

  .column-label-edit-btn:hover,
  .column-label-edit-btn:focus-visible {
    opacity: 1;
    background: var(--surface);
  }

  /* 列幅が狭いと「保存」「キャンセル」が途中で折り返して読めなくなるため、
     ボタンは縮めず、幅の調整は入力欄側で行う。
     min-width: 0 が無いとフォーム自身が列の幅より縮めず、ボタンが列から
     はみ出して押せなくなるため、あわせて指定する。 */
  .column-label-edit-form {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1 1 100%;
    min-width: 0;
  }

  .column-label-edit-form .btn {
    flex-shrink: 0;
    white-space: nowrap;
  }

  .column-label-input {
    font-family: inherit;
    font-size: 13px;
    padding: 3px 6px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    flex: 1 1 auto;
    min-width: 60px;
  }

  .column-count {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 9px;
    min-width: 22px;
    text-align: center;
  }

  /* カード一覧のみを列内で独立スクロールさせる部分。
     min-height を明示しておくことで、カードが増えても列全体を
     押し広げず、この領域内だけが縦スクロールになる */
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-height: 60px;
    border-radius: 8px;
    padding: 4px;
    overflow-y: auto;
    transition: background-color 0.12s ease;
  }

  /* ドロップ可能であることを示す状態。色だけに頼らず点線枠も併用する */
  .card-list.dropzone-active {
    background: var(--dropzone-bg);
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 30px 10px 12px;
    box-shadow: var(--shadow);
    cursor: grab;
  }

  .card.dragging {
    opacity: var(--dragging-opacity);
    border-style: dashed;
  }

  /* ドラッグ中に挿入位置を示す線。
     border で描くとカードの高さが変わり、境界付近でカードが上下に動いて
     ちらつくため、レイアウトに影響しない内側の影で描画する */
  .card.insert-before {
    box-shadow: var(--shadow), inset 0 3px 0 0 var(--insert-line);
  }

  .card.insert-after {
    box-shadow: var(--shadow), inset 0 -3px 0 0 var(--insert-line);
  }

  .card-title-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 0;
    margin: 0 0 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }

  .card-note {
    font-size: 12px;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .card-delete {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    line-height: 1;
    padding: 0;
    border-radius: 5px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
  }

  .card-delete:hover,
  .card-delete:focus-visible {
    color: var(--danger);
    border-color: var(--danger);
    background: var(--surface-alt);
  }

  /* カードの入力フォーム。追加用と編集用は見た目がほぼ同じなので、
     共通部分を .card-form にまとめ、違い（枠の有無）だけを個別に指定する */
  .card-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card-form label {
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .card-form input,
  .card-form textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    resize: vertical;
  }

  .card-form textarea {
    min-height: 48px;
  }

  .form-actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .add-card-area {
    margin-top: 8px;
    flex-shrink: 0;
  }

  .add-card-trigger {
    width: 100%;
    text-align: left;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }

  .add-card-trigger:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  /* 追加フォームはカード一覧の外（列の下部）に置くため、カードと同じ枠をつける */
  .add-card-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  footer {
    padding: 12px 24px 24px;
    font-size: 11.5px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>iKanban</h1>
    <p class="subtitle">個人用の実用最小Kanban（v0.2.3）</p>
  </div>
  <div class="header-controls">
    <div class="header-actions">
      <button type="button" class="btn" id="reset-button">初期状態にリセット</button>
      <button type="button" class="btn" id="export-button">バックアップ出力</button>
      <button type="button" class="btn" id="restore-button">バックアップ復元</button>
      <button type="button" class="btn" id="undo-restore-button" disabled>直前の復元を取り消す</button>
      <input type="file" id="restore-file-input" class="visually-hidden" accept="application/json,.json">
    </div>
    <div class="theme-switcher">
      <label for="theme-select">テーマ</label>
      <select id="theme-select">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="blue">Blue</option>
      </select>
    </div>
  </div>
</header>

<main>
  <div class="board" id="board">
    <section class="column" data-status="todo">
      <div class="column-header">
        <span class="column-title" data-status="todo"></span>
        <span class="column-count" data-count-for="todo">0</span>
      </div>
      <div class="card-list" data-status="todo"></div>
      <div class="add-card-area" data-status="todo"></div>
    </section>

    <section class="column" data-status="doing">
      <div class="column-header">
        <span class="column-title" data-status="doing"></span>
        <span class="column-count" data-count-for="doing">0</span>
      </div>
      <div class="card-list" data-status="doing"></div>
      <div class="add-card-area" data-status="doing"></div>
    </section>

    <section class="column" data-status="review">
      <div class="column-header">
        <span class="column-title" data-status="review"></span>
        <span class="column-count" data-count-for="review">0</span>
      </div>
      <div class="card-list" data-status="review"></div>
      <div class="add-card-area" data-status="review"></div>
    </section>

    <section class="column" data-status="done">
      <div class="column-header">
        <span class="column-title" data-status="done"></span>
        <span class="column-count" data-count-for="done">0</span>
      </div>
      <div class="card-list" data-status="done"></div>
      <div class="add-card-area" data-status="done"></div>
    </section>
  </div>
</main>

<footer>
  iKanban &mdash; カード・列の表示名・テーマ設定はこのブラウザの localStorage に保存されます。ブラウザのデータを削除すると内容も失われます。内容はヘッダーの「バックアップ出力」からJSONファイルへ書き出せます。
</footer>

<script>
  "use strict";

  var STATUSES = ["todo", "doing", "review", "done"];

  /* ============================================================
     localStorage の読み書き

     プライベートモードや容量超過では localStorage が例外を投げる。
     各所で try/catch を書くと扱いがばらつくため、ここに集約する。
     - 読込は失敗しても null を返す（呼び出し側は「未保存」と同じ扱いでよい）
     - 書込は成否を真偽値で返す（呼び出し側が利用者へ知らせられるようにする）
     ============================================================ */
  var Storage = (function () {
    function readText(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    function readJSON(key) {
      var raw = readText(key);
      if (!raw) {
        return null;
      }
      try {
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function writeText(key, value) {
      try {
        window.localStorage.setItem(key, value);
        return true;
      } catch (e) {
        console.warn("iKanban: 保存に失敗しました（" + key + "）", e);
        return false;
      }
    }

    function writeJSON(key, value) {
      return writeText(key, JSON.stringify(value));
    }

    function remove(key) {
      try {
        window.localStorage.removeItem(key);
      } catch (e) {
        // 削除できなくても実害は小さいため、そのまま続行する
      }
    }

    return {
      readText: readText,
      readJSON: readJSON,
      writeText: writeText,
      writeJSON: writeJSON,
      remove: remove
    };
  })();

  /* ============================================================
     ID生成
     ============================================================ */
  function generateId() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return window.crypto.randomUUID();
    }
    return "card-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  /* ============================================================
     初期サンプルデータ（初回起動時のみ使用）
     ============================================================ */
  function buildInitialBoard() {
    var cards = {};
    var columns = { todo: [], doing: [], review: [], done: [] };

    var sample = [
      { title: "申請フォームを整理する", note: "旧フォームの項目を洗い出す", status: "todo" },
      { title: "初期要件を整理する", note: "関係者へヒアリングした内容をまとめる", status: "todo" },
      { title: "マニュアルを更新する", note: "画面変更に合わせて手順を修正", status: "doing" },
      { title: "画面デザインを確認する", note: "配色とレイアウトのレビュー", status: "doing" },
      { title: "テスト結果をレビューする", note: "不具合の有無を確認", status: "review" },
      { title: "議事録を配布する", note: "前回MTGの内容を共有済み", status: "done" }
    ];

    sample.forEach(function (item) {
      var id = generateId();
      cards[id] = { title: item.title, note: item.note };
      columns[item.status].push(id);
    });

    return { cards: cards, columns: columns };
  }

  /* ============================================================
     データ保存・読込（カードとカード配置のみを対象とする）
     ============================================================ */
  var BoardStore = (function () {
    var STORAGE_KEY = "ikanban.board.v1";

    // 破損データの退避先。復元前バックアップと同じく固定の1キーで、
    // 退避のたびに上書きする（世代を残すと、保存容量が足りない状況で
    // 使えないコピーだけが際限なく溜まってしまうため）。
    var CORRUPTED_KEY = "ikanban.board.v1.corrupted";

    // 4列すべてがID配列として揃っていて、参照先のカードが実在するかを確認する。
    // 一部の列だけ欠損したデータや、存在しないカードIDを参照するデータを
    // ここで弾き、描画時のエラーを防ぐ。
    function isValidBoard(data) {
      if (!data || typeof data.cards !== "object" || data.cards === null) {
        return false;
      }
      if (!data.columns || typeof data.columns !== "object") {
        return false;
      }
      return STATUSES.every(function (status) {
        var ids = data.columns[status];
        return Array.isArray(ids) && ids.every(function (id) {
          return Object.prototype.hasOwnProperty.call(data.cards, id);
        });
      });
    }

    function load() {
      var raw = Storage.readText(STORAGE_KEY);
      if (!raw) {
        var initial = buildInitialBoard();
        save(initial);
        return initial;
      }

      var parsed = null;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        parsed = null;
      }

      if (isValidBoard(parsed)) {
        return parsed;
      }

      var recovered = buildInitialBoard();
      if (Storage.writeText(CORRUPTED_KEY, raw)) {
        // 退避できた場合のみ、元データを初期データで上書きする
        save(recovered);
      } else {
        console.warn("iKanban: 破損データを退避できなかったため、保存データは上書きしていません。今回は初期データで表示します。");
      }
      return recovered;
    }

    // 保存に成功したかどうかを呼び出し側が判定できるよう真偽値を返す。
    function save(board) {
      return Storage.writeJSON(STORAGE_KEY, board);
    }

    return { load: load, save: save, isValidBoard: isValidBoard };
  })();

  /* ============================================================
     テーマ管理（保存先はBoardStoreと分離する）
     ============================================================ */
  var ThemeManager = (function () {
    var STORAGE_KEY = "ikanban.theme.v1";
    var DEFAULT_THEME = "light";
    var ALLOWED_THEMES = ["light", "dark", "blue"];
    var selectEl = null;
    var current = DEFAULT_THEME;

    function isValidTheme(theme) {
      return ALLOWED_THEMES.indexOf(theme) !== -1;
    }

    // 許可された3テーマ以外は初期値へフォールバックする。
    // 保存値が壊れていた場合、data-theme に不明な値が入りどのCSSブロックにも
    // 一致せず配色が変わらないままになる（＝切替が効かないように見える）ため、
    // ここで必ず既知の値へ寄せておく。
    function sanitizeTheme(theme) {
      return isValidTheme(theme) ? theme : DEFAULT_THEME;
    }

    // 画面への反映のみを行う。保存の成否に関わらず、選択した瞬間に必ず呼ばれる。
    function apply(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      current = theme;
    }

    // 保存のみを行う。失敗してもその場の表示（apply）には影響させない。
    // 保存に成功したかどうかを呼び出し側が判定できるよう真偽値を返す。
    function save(theme) {
      return Storage.writeText(STORAGE_KEY, theme);
    }

    function load() {
      return sanitizeTheme(Storage.readText(STORAGE_KEY));
    }

    function init(el) {
      selectEl = el;
      var theme = load();
      apply(theme);
      selectEl.value = theme;

      selectEl.addEventListener("change", function () {
        var next = sanitizeTheme(selectEl.value);
        apply(next);
        if (!save(next)) {
          notifySaveFailure();
        }
      });
    }

    // バックアップ復元・取り消し時に外部からテーマを設定するための入口。
    // 表示・保存・セレクトボックスの選択状態を一括で揃え、保存の成否を返す。
    function setAndPersist(theme) {
      var next = sanitizeTheme(theme);
      apply(next);
      var saved = save(next);
      if (selectEl) {
        selectEl.value = next;
      }
      return saved;
    }

    function getCurrent() {
      return current;
    }

    return { init: init, isValidTheme: isValidTheme, setAndPersist: setAndPersist, getCurrent: getCurrent };
  })();

  /* ============================================================
     列表示名（内部ID todo/doing/review/done は固定。表示名のみ変更可能）
     ============================================================ */
  var ColumnLabels = (function () {
    var STORAGE_KEY = "ikanban.columnLabels.v1";
    var DEFAULT_LABELS = { todo: "未着手", doing: "作業中", review: "確認待ち", done: "完了" };

    function isValidLabels(data) {
      if (!data || typeof data !== "object") {
        return false;
      }
      return STATUSES.every(function (status) {
        return typeof data[status] === "string" && data[status].trim() !== "";
      });
    }

    // 保存値の一部が欠けたり壊れていても、使える列だけ採用し残りは既定値で
    // 補う。テーマ（全体を初期値へフォールバック）と違い、列名は列ごとに
    // 独立した値なので、部分的な復旧の方が利用者の設定を活かせる。
    function sanitize(data) {
      var result = {};
      STATUSES.forEach(function (status) {
        var value = data && data[status];
        result[status] = (typeof value === "string" && value.trim() !== "") ? value.trim() : DEFAULT_LABELS[status];
      });
      return result;
    }

    // 未保存（null）でも sanitize が全列を既定値で埋めるため、分岐は不要。
    function load() {
      return sanitize(Storage.readJSON(STORAGE_KEY));
    }

    // 保存に成功したかどうかを呼び出し側が判定できるよう真偽値を返す。
    function save(labels) {
      return Storage.writeJSON(STORAGE_KEY, labels);
    }

    return { load: load, save: save, sanitize: sanitize, isValidLabels: isValidLabels };
  })();

  /* ============================================================
     アプリ状態（メモリ上の現在値。BoardStore / ColumnLabels の内容を保持する）
     ============================================================ */
  var state = null;
  var columnLabels = null;

  // 保存できなかったことに気づかないまま操作を続けると、再読み込みで内容が
  // 失われてしまう。ただし操作のたびに知らせても邪魔になるだけなので、
  // ページを開いている間に一度だけ伝える。
  var saveFailureNotified = false;

  function notifySaveFailure() {
    if (saveFailureNotified) return;
    saveFailureNotified = true;
    window.alert(
      "変更をこのブラウザに保存できませんでした。\n" +
      "操作はこのまま続けられますが、ページを再読み込みすると変更が失われる可能性があります。\n" +
      "ブラウザの保存容量やプライベートモードの設定をご確認ください。"
    );
  }

  function persist() {
    if (!BoardStore.save(state)) {
      notifySaveFailure();
    }
  }

  // カードが現在どの列にあるかを返す（見つからない場合は null）
  function findStatusOf(id) {
    for (var i = 0; i < STATUSES.length; i++) {
      if (state.columns[STATUSES[i]].indexOf(id) !== -1) {
        return STATUSES[i];
      }
    }
    return null;
  }

  /* ============================================================
     カード操作（追加・編集・削除）
     ============================================================ */
  // title / note は入力フォーム側でトリムと必須チェックを済ませてから渡す。
  var CardActions = (function () {
    function addCard(status, title, note) {
      var id = generateId();
      state.cards[id] = { title: title, note: note };
      state.columns[status].push(id);
      persist();
      Renderer.appendCard(status, id);
    }

    function editCard(id, title, note) {
      state.cards[id] = { title: title, note: note };
      persist();
      Renderer.refreshCard(id);
    }

    function deleteCard(id) {
      var status = findStatusOf(id);
      if (status === null) {
        return;
      }
      var list = state.columns[status];
      list.splice(list.indexOf(id), 1);
      delete state.cards[id];
      persist();
      Renderer.removeCard(status, id);
    }

    return { addCard: addCard, editCard: editCard, deleteCard: deleteCard };
  })();

  /* ============================================================
     描画

     画面全体を描き直す renderAll は、起動時・リセット・バックアップ復元など
     ボードの内容がまるごと入れ替わるときだけに使う。
     カード1枚の追加・編集・削除・移動では、変化した箇所だけを更新する。
     全体を描き直すと、開いたままのカード編集フォームが別の操作をした拍子に
     消えて入力途中の内容が失われるため（例：カードAを編集中に別の列でカードを
     追加すると、Aの編集内容が消える）。

     state.columns の並び順とカード一覧のDOMの並び順は常に一致させる。
     ドロップ位置の判定はDOM側の並びを見て行うため、この一致が前提になる。
     ============================================================ */
  var Renderer = (function () {
    function listOf(status) {
      return document.querySelector('.card-list[data-status="' + status + '"]');
    }

    // 件数は実際に表示しているカード数から数えるため、画面と食い違うことがない
    function updateCount(status) {
      document.querySelector('[data-count-for="' + status + '"]').textContent =
        String(listOf(status).children.length);
    }

    function renderAll() {
      STATUSES.forEach(renderColumn);
    }

    function renderColumn(status) {
      var list = listOf(status);
      list.innerHTML = "";

      // 参照先のカードが実在することは保存データの検証で保証済みなので、
      // ここでは間引かずにそのまま並べる（間引くとDOMとstateの並びがずれる）
      state.columns[status].forEach(function (id) {
        list.appendChild(buildCardElement(id, state.cards[id]));
      });

      updateCount(status);
    }

    // 追加したカードは列の末尾に入る。カードが多い列では画面外になり
    // 「追加できていない」ように見えるため、末尾までスクロールして見せる。
    function appendCard(status, id) {
      var list = listOf(status);
      list.appendChild(buildCardElement(id, state.cards[id]));
      updateCount(status);
      list.scrollTop = list.scrollHeight;
    }

    function removeCard(status, id) {
      var el = document.getElementById(id);
      if (el) {
        el.remove();
      }
      updateCount(status);
    }

    // 編集フォームを閉じ、更新後の内容で表示に戻す
    function refreshCard(id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.draggable = true;
      renderCardDisplay(el, id, state.cards[id]);
    }

    // index は移動後の state.columns[newStatus] における位置。
    // 先に元の位置から取り除いてから挿入するため、そのまま同じ位置に入る。
    function moveCardTo(id, oldStatus, newStatus, index) {
      var el = document.getElementById(id);
      if (!el) return;

      var list = listOf(newStatus);
      el.remove();
      list.insertBefore(el, list.children[index] || null);

      updateCount(newStatus);
      if (oldStatus !== newStatus) {
        updateCount(oldStatus);
      }
    }

    // カードがどの列にあるかは state.columns が持つため、要素側には持たせない
    function buildCardElement(id, card) {
      var el = document.createElement("div");
      el.className = "card";
      el.draggable = true;
      el.id = id;
      renderCardDisplay(el, id, card);
      return el;
    }

    function renderCardDisplay(el, id, card) {
      el.innerHTML = "";

      var titleBtn = document.createElement("button");
      titleBtn.type = "button";
      titleBtn.className = "card-title-btn";
      titleBtn.textContent = card.title;
      titleBtn.setAttribute("aria-label", "カードを編集: " + card.title);
      titleBtn.addEventListener("click", function () {
        renderCardEditForm(el, id, card);
      });
      el.appendChild(titleBtn);

      if (card.note) {
        var note = document.createElement("p");
        note.className = "card-note";
        note.textContent = card.note;
        el.appendChild(note);
      }

      var deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "card-delete";
      deleteBtn.setAttribute("aria-label", "このカードを削除: " + card.title);
      deleteBtn.textContent = "×";
      deleteBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        if (window.confirm("このカードを削除しますか？\n「" + card.title + "」")) {
          CardActions.deleteCard(id);
        }
      });
      el.appendChild(deleteBtn);
    }

    // カードの入力フォーム（追加用・編集用）を組み立てる。
    // 両者の違いは「ラベルを見せるか」「ボタンの文言」「保存時の処理」だけなので、
    // 組み立て自体はここに1つだけ置く。
    // 戻り値の form を呼び出し側が好きな場所に入れ、titleInput / noteInput で
    // 追加後のクリアやフォーカス移動を行う。
    function buildCardForm(config) {
      var form = document.createElement("form");
      form.className = config.className;

      var titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.id = config.idPrefix + "-title";
      titleInput.required = true;
      titleInput.value = config.title;

      var noteInput = document.createElement("textarea");
      noteInput.id = config.idPrefix + "-note";
      noteInput.value = config.note;

      var actions = document.createElement("div");
      actions.className = "form-actions";

      var cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "btn";
      cancelBtn.textContent = config.cancelLabel;
      cancelBtn.addEventListener("click", config.onCancel);

      var submitBtn = document.createElement("button");
      submitBtn.type = "submit";
      submitBtn.className = "btn btn-primary";
      submitBtn.textContent = config.submitLabel;

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        // 空白だけのタイトルは登録しない。入力欄をトリム後の値へ揃えたうえで
        // ブラウザ標準の必須チェックを出すことで、「押しても何も起きない」状態を防ぐ。
        titleInput.value = titleInput.value.trim();
        if (!titleInput.value) {
          titleInput.reportValidity();
          return;
        }
        config.onSubmit(titleInput.value, noteInput.value.trim());
      });

      actions.appendChild(cancelBtn);
      actions.appendChild(submitBtn);
      form.appendChild(buildFieldLabel(titleInput.id, config.titleLabel, config.hideLabels));
      form.appendChild(titleInput);
      form.appendChild(buildFieldLabel(noteInput.id, config.noteLabel, config.hideLabels));
      form.appendChild(noteInput);
      form.appendChild(actions);

      return { form: form, titleInput: titleInput, noteInput: noteInput };
    }

    // 編集フォームはカード内の狭い場所に出すためラベルを読み上げ専用にする。
    // 追加フォームは何を入力する欄か分かるよう、ラベルを見せる。
    function buildFieldLabel(inputId, text, hidden) {
      var label = document.createElement("label");
      label.setAttribute("for", inputId);
      label.textContent = text;
      if (hidden) {
        label.className = "visually-hidden";
      }
      return label;
    }

    function renderCardEditForm(el, id, card) {
      el.innerHTML = "";
      el.draggable = false;

      var fields = buildCardForm({
        className: "card-form",
        idPrefix: "edit-" + id,
        hideLabels: true,
        titleLabel: "タイトル",
        noteLabel: "補足",
        title: card.title,
        note: card.note || "",
        submitLabel: "保存",
        cancelLabel: "キャンセル",
        onSubmit: function (title, note) {
          CardActions.editCard(id, title, note);
        },
        onCancel: function () {
          el.draggable = true;
          renderCardDisplay(el, id, card);
        }
      });

      el.appendChild(fields.form);
      fields.titleInput.focus();
    }

    // 「+ カードを追加」の領域はカードの内容に依存しないため、
    // カードの再描画では作り直さない。入力途中のフォームが
    // 他の操作（別カードの追加・移動など）で消えるのを防ぐ。
    function renderAddCardArea(status) {
      var area = document.querySelector('.add-card-area[data-status="' + status + '"]');
      area.innerHTML = "";

      var trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "add-card-trigger";
      trigger.textContent = "+ カードを追加";
      trigger.addEventListener("click", function () {
        renderAddCardForm(area, status);
      });
      area.appendChild(trigger);
    }

    function renderAddCardForm(area, status) {
      area.innerHTML = "";

      var fields = buildCardForm({
        className: "card-form add-card-form",
        idPrefix: "new-" + status,
        hideLabels: false,
        titleLabel: "タイトル（必須）",
        noteLabel: "補足",
        title: "",
        note: "",
        submitLabel: "追加",
        cancelLabel: "閉じる",
        // 追加後もフォームを開いたままにし、続けて何枚でも登録できるようにする
        onSubmit: function (title, note) {
          CardActions.addCard(status, title, note);
          fields.titleInput.value = "";
          fields.noteInput.value = "";
          fields.titleInput.focus();
        },
        onCancel: function () {
          renderAddCardArea(status);
        }
      });

      area.appendChild(fields.form);
      fields.titleInput.focus();
    }

    return {
      renderAll: renderAll,
      renderAddCardArea: renderAddCardArea,
      appendCard: appendCard,
      removeCard: removeCard,
      refreshCard: refreshCard,
      moveCardTo: moveCardTo
    };
  })();

  /* ============================================================
     列名編集UI（列ヘッダーの表示名クリック→編集。内部IDは変更しない）
     ============================================================ */
  var ColumnLabelEditor = (function () {
    function buildDisplay(status) {
      var frag = document.createDocumentFragment();

      var h2 = document.createElement("h2");
      h2.textContent = columnLabels[status];

      var editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "column-label-edit-btn";
      editBtn.setAttribute("aria-label", "列名を編集: " + columnLabels[status]);
      editBtn.textContent = "✎";
      editBtn.addEventListener("click", function () {
        startEdit(status);
      });

      frag.appendChild(h2);
      frag.appendChild(editBtn);
      return frag;
    }

    function titleElOf(status) {
      return document.querySelector('.column-title[data-status="' + status + '"]');
    }

    function showDisplay(status) {
      var titleEl = titleElOf(status);
      titleEl.innerHTML = "";
      titleEl.appendChild(buildDisplay(status));
    }

    function startEdit(status) {
      var titleEl = titleElOf(status);
      titleEl.innerHTML = "";

      var form = document.createElement("form");
      form.className = "column-label-edit-form";

      var label = document.createElement("label");
      label.className = "visually-hidden";
      label.setAttribute("for", "column-label-" + status);
      label.textContent = "列名";

      var input = document.createElement("input");
      input.type = "text";
      input.id = "column-label-" + status;
      input.className = "column-label-input";
      input.value = columnLabels[status];
      input.required = true;

      var saveBtn = document.createElement("button");
      saveBtn.type = "submit";
      saveBtn.className = "btn btn-xs btn-primary";
      saveBtn.textContent = "保存";

      var cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "btn btn-xs";
      cancelBtn.textContent = "キャンセル";
      cancelBtn.addEventListener("click", function () {
        showDisplay(status);
      });

      // 空文字だけの列名は保存しない（inputのrequiredでブラウザが送信を止める）
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var trimmed = input.value.trim();
        if (!trimmed) {
          return;
        }
        columnLabels[status] = trimmed;
        if (!ColumnLabels.save(columnLabels)) {
          notifySaveFailure();
        }
        showDisplay(status);
      });

      form.appendChild(label);
      form.appendChild(input);
      form.appendChild(saveBtn);
      form.appendChild(cancelBtn);
      titleEl.appendChild(form);

      input.focus();
      input.select();
    }

    // 初期化時、およびバックアップ復元後に全列の表示を現在のcolumnLabelsへ揃える
    function renderAll() {
      STATUSES.forEach(showDisplay);
    }

    return { renderAll: renderAll };
  })();

  /* ============================================================
     ドラッグ＆ドロップ（列間移動＋同一列内の並び替え）
     ============================================================ */
  var DragAndDrop = (function () {
    // ポインタが列の上下端からこの距離に入ったら、列内を自動スクロールする
    var AUTO_SCROLL_EDGE = 36;
    var AUTO_SCROLL_STEP = 12;

    // ドラッグ中の状態は、対象の要素を覚えておいて直接付け外しする。
    // 画面全体を検索して目印を消して回ると、dragover のたびにDOM全体を
    // 走査することになり、カードが増えるほど動きが重くなるため。
    var draggedEl = null;
    var markedCard = null; // 挿入線を表示しているカード
    var activeList = null; // ドロップ先として強調しているカード一覧

    function clearInsertMarker() {
      if (markedCard) {
        markedCard.classList.remove("insert-before", "insert-after");
        markedCard = null;
      }
    }

    function setActiveList(list) {
      if (activeList === list) return;
      if (activeList) {
        activeList.classList.remove("dropzone-active");
      }
      activeList = list;
      if (activeList) {
        activeList.classList.add("dropzone-active");
      }
    }

    function clearDragFeedback() {
      clearInsertMarker();
      setActiveList(null);
    }

    // リスト内のカードを上から見て、ポインタのY座標が入る位置を返す（0〜カード数）。
    // 表示順とstate.columnsの並び順は一致しているため、この値をそのまま
    // 挿入位置として使える。カードの隙間や余白にドロップされた場合も、
    // 見た目どおりの位置になる。
    function getInsertIndex(cards, clientY) {
      for (var i = 0; i < cards.length; i++) {
        var rect = cards[i].getBoundingClientRect();
        if (clientY < rect.top + rect.height / 2) {
          return i;
        }
      }
      return cards.length;
    }

    // 挿入位置を示す線を、対象のカードの上辺または下辺に表示する
    function showInsertMarker(cards, insertIndex) {
      clearInsertMarker();
      if (cards.length === 0) return;

      if (insertIndex < cards.length) {
        markedCard = cards[insertIndex];
        markedCard.classList.add("insert-before");
      } else {
        markedCard = cards[cards.length - 1];
        markedCard.classList.add("insert-after");
      }
    }

    // ドラッグ中はマウスホイールで列内をスクロールできないため、
    // カードの多い列では画面外の位置へ移動できなくなる。
    // 列の上下端に近づいたら少しずつスクロールして、その位置まで運べるようにする。
    function autoScroll(list, clientY) {
      var rect = list.getBoundingClientRect();
      if (clientY < rect.top + AUTO_SCROLL_EDGE) {
        list.scrollTop -= AUTO_SCROLL_STEP;
      } else if (clientY > rect.bottom - AUTO_SCROLL_EDGE) {
        list.scrollTop += AUTO_SCROLL_STEP;
      }
    }

    function handleDragStart(event) {
      var card = event.target.closest(".card");
      // 編集フォームを開いているカード（draggable=false）は対象外。
      // 入力欄の文字列を選択してドラッグした場合に、カードごと
      // 移動してしまい編集内容が失われるのを防ぐ。
      if (!card || !card.draggable) return;
      draggedEl = card;
      card.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", card.id);
    }

    function handleDragEnd() {
      if (draggedEl) {
        draggedEl.classList.remove("dragging");
        draggedEl = null;
      }
      clearDragFeedback();
    }

    function handleDragOver(event) {
      var list = event.target.closest(".card-list");
      if (!list || !draggedEl) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";

      setActiveList(list);
      autoScroll(list, event.clientY);

      // 自動スクロール後の位置で判定するため、カードの取得はここで1回だけ行う
      var cards = list.querySelectorAll(".card");
      showInsertMarker(cards, getInsertIndex(cards, event.clientY));
    }

    // 子要素をまたぐたびにleaveが発生するため、強調中の列から実際に
    // 出た場合のみ解除する
    function handleDragLeave(event) {
      if (!activeList || activeList.contains(event.relatedTarget)) return;
      clearDragFeedback();
    }

    function handleDrop(event) {
      var list = event.target.closest(".card-list");
      if (!list || !draggedEl) return;
      event.preventDefault();

      var id = draggedEl.id;
      var insertIndex = getInsertIndex(list.querySelectorAll(".card"), event.clientY);
      clearDragFeedback();
      moveCard(id, list.getAttribute("data-status"), insertIndex);
    }

    // insertIndex は「移動前の並び」での位置。移動元から取り除いた分だけ
    // 位置がずれるため、同じ列で前から後ろへ動かす場合は1つ手前に補正する。
    function moveCard(id, newStatus, insertIndex) {
      var oldStatus = findStatusOf(id);
      if (oldStatus === null) return;

      var from = state.columns[oldStatus];
      var oldIndex = from.indexOf(id);
      from.splice(oldIndex, 1);

      if (oldStatus === newStatus && oldIndex < insertIndex) {
        insertIndex -= 1;
      }

      var to = state.columns[newStatus];
      var index = Math.max(0, Math.min(insertIndex, to.length));
      to.splice(index, 0, id);

      persist();
      Renderer.moveCardTo(id, oldStatus, newStatus, index);
    }

    function init(boardEl) {
      boardEl.addEventListener("dragstart", handleDragStart);
      boardEl.addEventListener("dragend", handleDragEnd);
      boardEl.addEventListener("dragover", handleDragOver);
      boardEl.addEventListener("dragleave", handleDragLeave);
      boardEl.addEventListener("drop", handleDrop);
    }

    return { init: init };
  })();

  /* ============================================================
     リセット
     ============================================================ */
  function initResetButton(buttonEl) {
    buttonEl.addEventListener("click", function () {
      var confirmed = window.confirm(
        "Kanbanの内容を初期状態に戻します。追加・編集・削除・並び替えの内容は失われます。\n" +
        "列の表示名とテーマは変更されません。よろしいですか？"
      );
      if (!confirmed) return;
      state = buildInitialBoard();
      persist(); // 保存できなかった場合は persist が利用者へ知らせる
      Renderer.renderAll();
    });
  }

  /* ============================================================
     バックアップ出力・復元・直前の復元の取り消し
     ============================================================ */
  var BackupRestore = (function () {
    var APP_NAME = "iKanban";
    var CURRENT_FORMAT_VERSION = 1;
    var SUPPORTED_FORMAT_VERSIONS = [1];

    // 復元前の状態を退避しておくキー。復元を実行するたびにこのキー1つを
    // 上書きする（＝直前1世代分のみ保持。世代管理は行わない）。
    var BEFORE_RESTORE_KEY = "ikanban.beforeRestore.v1";

    var undoBtnEl = null;

    function pad2(n) {
      return n < 10 ? "0" + n : String(n);
    }

    // ファイル名用の日時文字列（例: 20260810-235959）。複数回出力しても
    // 上書きされず判別しやすいよう、ブラウザのローカル時刻を使う。
    function timestampForFilename(date) {
      return date.getFullYear() + pad2(date.getMonth() + 1) + pad2(date.getDate()) +
        "-" + pad2(date.getHours()) + pad2(date.getMinutes()) + pad2(date.getSeconds());
    }

    function buildExportData() {
      return {
        app: APP_NAME,
        formatVersion: CURRENT_FORMAT_VERSION,
        exportedAt: new Date().toISOString(),
        board: { cards: state.cards, columns: state.columns },
        columnLabels: columnLabels,
        theme: ThemeManager.getCurrent()
      };
    }

    function download() {
      var data = buildExportData();
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);

      var a = document.createElement("a");
      a.href = url;
      a.download = "ikanban-backup-" + timestampForFilename(new Date()) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      // クリック直後に同期的に解放すると、ブラウザによっては保存が
      // 始まる前にデータが消え、ダウンロードに失敗する。少し待ってから解放する。
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
    }

    // 復元データ（およびlocalStorageへ退避した「直前の復元前状態」）として
    // 妥当かを検証する。検証ロジックは各モジュールが持つものをそのまま
    // 再利用し、ここでは重複させない。
    function isValidImportData(data) {
      if (!data || typeof data !== "object") {
        return false;
      }
      if (data.app !== APP_NAME) {
        return false;
      }
      if (SUPPORTED_FORMAT_VERSIONS.indexOf(data.formatVersion) === -1) {
        return false;
      }
      if (!BoardStore.isValidBoard(data.board)) {
        return false;
      }
      if (!ColumnLabels.isValidLabels(data.columnLabels)) {
        return false;
      }
      if (!ThemeManager.isValidTheme(data.theme)) {
        return false;
      }
      return true;
    }

    // 取り消し可能な「直前の復元前状態」を読み込む。存在しない、または
    // 壊れている場合はnullを返す（取り消し不可として扱う）。
    function loadBeforeRestoreSnapshot() {
      var parsed = Storage.readJSON(BEFORE_RESTORE_KEY);
      return isValidImportData(parsed) ? parsed : null;
    }

    function updateUndoButtonState() {
      undoBtnEl.disabled = loadBeforeRestoreSnapshot() === null;
    }

    // data（board / columnLabels / テーマ）を画面へ反映し、保存する。
    // 3つとも保存できたときだけ true を返す（途中で打ち切らず全て試す）。
    // 描画は既存の Renderer / ColumnLabelEditor をそのまま使い、
    // 復元専用の描画ロジックは増やさない。
    function applyData(data) {
      state = { cards: data.board.cards, columns: data.board.columns };
      columnLabels = ColumnLabels.sanitize(data.columnLabels);

      var boardSaved = BoardStore.save(state);
      var labelsSaved = ColumnLabels.save(columnLabels);
      var themeSaved = ThemeManager.setAndPersist(data.theme);

      Renderer.renderAll();
      STATUSES.forEach(Renderer.renderAddCardArea);
      ColumnLabelEditor.renderAll();

      return boardSaved && labelsSaved && themeSaved;
    }

    function restore(data) {
      var beforeRestore = buildExportData();

      if (!Storage.writeJSON(BEFORE_RESTORE_KEY, beforeRestore)) {
        window.alert(
          "復元前バックアップの退避に失敗したため、復元を中止しました。\n" +
          "現在のKanbanの内容は変更していません。"
        );
        return;
      }

      if (applyData(data)) {
        window.alert("復元が完了しました。");
      } else {
        // 一部だけ保存された中途半端な状態を残さないよう、復元前の内容へ戻す。
        // 復元しなかったことになるので、取り消し用の退避データも消しておく
        // （残すと「取り消せる復元」が無いのにボタンが有効になってしまう）。
        applyData(beforeRestore);
        Storage.remove(BEFORE_RESTORE_KEY);
        window.alert(
          "復元内容を保存できなかったため、復元を中止して元の内容へ戻しました。\n" +
          "ブラウザの保存容量などをご確認のうえ、もう一度お試しください。"
        );
      }

      updateUndoButtonState();
    }

    function restoreFromFile(file) {
      var reader = new FileReader();

      reader.onload = function () {
        var parsed = null;
        try {
          parsed = JSON.parse(String(reader.result));
        } catch (e) {
          parsed = null;
        }

        if (!isValidImportData(parsed)) {
          window.alert(
            "復元に失敗しました。選択したファイルはiKanbanのバックアップ形式として認識できません。\n" +
            "現在のKanbanの内容は変更していません。"
          );
          return;
        }

        var confirmed = window.confirm(
          "現在のKanbanの内容を、選択したファイルの内容で置き換えます。\n" +
          "元に戻せるよう、現在の内容は復元前にこのブラウザ内へ退避されます（直前1回分のみ）。\n" +
          "よろしいですか？"
        );
        if (!confirmed) {
          return;
        }

        restore(parsed);
      };

      reader.onerror = function () {
        window.alert("ファイルの読み込みに失敗しました。現在のKanbanの内容は変更していません。");
      };

      reader.readAsText(file);
    }

    function undoLastRestore() {
      var snapshot = loadBeforeRestoreSnapshot();
      if (!snapshot) {
        window.alert("取り消せる復元はありません。");
        updateUndoButtonState();
        return;
      }

      var confirmed = window.confirm(
        "直前の「バックアップ復元」を取り消し、復元前の内容へ戻します。\n" +
        "取り消せるのはこの1回分のみです。よろしいですか？"
      );
      if (!confirmed) {
        return;
      }

      // 取り消し自体が「安全な状態への復帰」なので、これ以上戻す先はない。
      // 保存に失敗しても表示は取り消し後のまま残し、その旨だけを伝える。
      if (applyData(snapshot)) {
        // 取り消しは直前1回分のみを対象とするため、使った退避データは消費する
        Storage.remove(BEFORE_RESTORE_KEY);
        window.alert("取り消しが完了しました。");
      } else {
        window.alert(
          "取り消し後の内容を保存できませんでした。表示は取り消し後の内容になっていますが、\n" +
          "再読み込みすると保存できなかった項目が元に戻る可能性があります。もう一度お試しください。"
        );
      }
      updateUndoButtonState();
    }

    function init(exportBtn, restoreBtn, fileInput, undoBtn) {
      undoBtnEl = undoBtn;

      exportBtn.addEventListener("click", download);

      restoreBtn.addEventListener("click", function () {
        fileInput.click();
      });

      fileInput.addEventListener("change", function () {
        var file = fileInput.files && fileInput.files[0];
        fileInput.value = ""; // 同じファイルを選び直しても change が発火するようにする
        if (!file) return;
        restoreFromFile(file);
      });

      undoBtn.addEventListener("click", undoLastRestore);

      updateUndoButtonState();
    }

    return { init: init };
  })();

  /* ============================================================
     初期化
     ============================================================ */
  document.addEventListener("DOMContentLoaded", function () {
    ThemeManager.init(document.getElementById("theme-select"));
    state = BoardStore.load();
    columnLabels = ColumnLabels.load();
    ColumnLabelEditor.renderAll();
    Renderer.renderAll();
    STATUSES.forEach(Renderer.renderAddCardArea);
    DragAndDrop.init(document.getElementById("board"));
    initResetButton(document.getElementById("reset-button"));
    BackupRestore.init(
      document.getElementById("export-button"),
      document.getElementById("restore-button"),
      document.getElementById("restore-file-input"),
      document.getElementById("undo-restore-button")
    );
  });
</script>

</body>
</html>
