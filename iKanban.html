<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iKanban</title>
<style>
  /* ============================================================
     デザイン規則（IBM Carbon Design System の考え方を参考にした業務向けUI）
     - 余白は 4 / 8 / 12 / 16 / 24px の段階だけを使う
     - 文字は 12px（補助）/ 13px（操作部品）/ 14px（本文・見出し）/ 16px（アプリ名）
     - 角丸は付けない（0）。区切りは面の色と 1px の境界線で表す
     - 影は使わない。浮き上がりではなく、色の階層（背景 < 列 < カード）で奥行きを示す
     - 操作部品の高さは 32px に統一する
     - 強調色は「主操作」「フォーカス」「挿入位置」にだけ使う

     テーマ変数
     - :root が既定（Light）テーマ。html[data-theme="xxx"] で値を上書きする
     - レイアウトはテーマ間で共通。配色だけが変わる
     ============================================================ */
  :root {
    --bg: #f4f4f4;             /* ページ背景 */
    --surface: #ffffff;        /* ヘッダー */
    --column: #e8e8e8;         /* 列の背景 */
    --card: #ffffff;           /* カード・追加フォームの背景 */
    --card-hover: #f4f4f4;
    --field: #f4f4f4;          /* 入力欄の背景 */
    --hover: #e8e8e8;          /* ヘッダー上のボタンのホバー面 */
    --hover-column: #d8d8d8;   /* 列上のボタンのホバー面 */
    --border: #c6c6c6;         /* 列・ヘッダーなど構造の区切り */
    --card-border: #e0e0e0;
    --border-hover: #a8a8a8;
    --border-strong: #8d8d8d;  /* 入力欄の下線・ボタンの輪郭 */
    --text: #161616;
    --text-muted: #525252;
    --text-disabled: #a8a8a8;
    --accent: #0f62fe;         /* 文字・線として使う強調色 */
    --primary: #0f62fe;        /* 主ボタンの面 */
    --primary-hover: #0353e9;
    --on-primary: #ffffff;
    --focus: #0f62fe;
    --danger: #da1e28;
    --danger-solid: #da1e28;
    --on-danger: #ffffff;
    --dropzone-bg: #d0e2ff;
    --dragging-opacity: 0.5;

    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --control-h: 32px;
  }

  html[data-theme="dark"] {
    --bg: #161616;
    --surface: #262626;
    --column: #262626;
    --card: #393939;
    --card-hover: #474747;
    --field: #262626;
    --hover: #393939;
    --hover-column: #393939;
    --border: #3d3d3d;
    --card-border: #4c4c4c;
    --border-hover: #6f6f6f;
    --border-strong: #8d8d8d;
    --text: #f4f4f4;
    --text-muted: #c6c6c6;
    --text-disabled: #6f6f6f;
    --accent: #78a9ff;
    --primary: #0f62fe;
    --primary-hover: #0353e9;
    --on-primary: #ffffff;
    --focus: #ffffff;
    --danger: #ff8389;
    --danger-solid: #da1e28;
    --on-danger: #ffffff;
    --dropzone-bg: #1d2f55;
  }

  html[data-theme="blue"] {
    --bg: #edf5ff;
    --surface: #ffffff;
    --column: #d0e2ff;
    --card: #ffffff;
    --card-hover: #edf5ff;
    --field: #edf5ff;
    --hover: #d0e2ff;
    --hover-column: #a6c8ff;
    --border: #a6c8ff;
    --card-border: #b6d0f7;
    --border-hover: #78a9ff;
    --border-strong: #6f8ab8;
    --text: #001141;
    --text-muted: #3a4f73;
    --text-disabled: #7d93b5;
    --accent: #0043ce;
    --primary: #0043ce;
    --primary-hover: #002d9c;
    --on-primary: #ffffff;
    --focus: #0043ce;
    --danger: #a2191f;
    --danger-solid: #a2191f;
    --on-danger: #ffffff;
    --dropzone-bg: #bfd7fb;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 14px;
    line-height: 1.43;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  button,
  input,
  select,
  textarea {
    font-family: inherit;
  }

  /* ---------- ヘッダー ----------
     左: アプリ名（読むだけの情報） / 右: 操作ツールバー。
     狭いときは「操作のまとまり」単位で折り返し、ボタン1つずつがばらけないようにする */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: var(--sp-2) var(--sp-5);
    min-height: 48px;
    padding: var(--sp-2) var(--sp-4);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .app-title {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 var(--sp-3);
  }

  .app-title h1 {
    font-size: 16px;
    font-weight: 600;
    line-height: 24px;
    margin: 0;
  }

  .app-title .subtitle {
    margin: 0;
    font-size: 12px;
    color: var(--text-muted);
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: var(--sp-2) var(--sp-4);
  }

  /* 関連する操作は隣り合わせにして枠を共有し、ひとまとまりに見せる */
  .btn-set {
    display: inline-flex;
    flex-wrap: wrap;
  }

  .btn-set .btn + .btn {
    margin-left: -1px;
  }

  .btn-set .btn:hover,
  .btn-set .btn:focus-visible {
    position: relative;
    z-index: 1;
  }

  .theme-switcher {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }

  .theme-switcher label {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* 破壊的操作は他の操作から少し離す（折り返したときは左端に揃える） */
  @media (min-width: 721px) {
    .toolbar .btn-danger {
      margin-left: var(--sp-2);
    }
  }

  /* ---------- ボタン ----------
     .btn          : 通常操作（輪郭のみ）
     .btn-primary  : 画面内で最も主となる操作（塗り）
     .btn-ghost    : 補助操作（輪郭なし）
     .btn-danger   : 破壊的操作（赤。ホバーで塗り） */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    height: var(--control-h);
    padding: 0 var(--sp-3);
    font-size: 13px;
    line-height: 1;
    white-space: nowrap;
    border-radius: 0;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }

  .btn:hover {
    background: var(--hover);
  }

  .btn:disabled,
  .btn:disabled:hover {
    background: transparent;
    border-color: var(--border);
    color: var(--text-disabled);
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--on-primary);
  }

  .btn-primary:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
  }

  .btn-ghost {
    border-color: transparent;
  }

  .btn-danger {
    border-color: transparent;
    color: var(--danger);
  }

  .btn-danger:hover {
    background: var(--danger-solid);
    color: var(--on-danger);
  }

  /* 「直前の復元を取り消す」: 取り消せる内容があるときだけ点（●）と強調色で知らせる */
  .btn-undo:not(:disabled) {
    color: var(--accent);
  }

  .btn-undo:not(:disabled)::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* フォーカスは 2px の実線で、背景色に左右されず見えるようにする */
  .btn:focus-visible,
  .icon-btn:focus-visible,
  .card-title-btn:focus-visible,
  .add-card-trigger:focus-visible,
  select:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: -2px;
  }

  /* ---------- 入力部品（カード追加・カード編集・列名編集で共通） ---------- */
  .form {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: var(--sp-1);
  }

  .field label {
    font-size: 12px;
    line-height: 16px;
    color: var(--text-muted);
  }

  .form input[type="text"],
  .form textarea,
  .theme-switcher select {
    width: 100%;
    height: var(--control-h);
    padding: 0 var(--sp-3);
    font-size: 14px;
    border: none;
    border-bottom: 1px solid var(--border-strong);
    border-radius: 0;
    background: var(--field);
    color: var(--text);
  }

  .form textarea {
    height: auto;
    min-height: 64px;
    padding: var(--sp-2) var(--sp-3);
    line-height: 1.43;
    resize: vertical;
  }

  .theme-switcher select {
    width: auto;
    padding: 0 var(--sp-2);
    font-size: 13px;
  }

  .form-actions {
    display: flex;
    gap: var(--sp-2);
    justify-content: flex-end;
  }

  /* アイコンだけのボタン（列名編集・カード削除）。名前は aria-label と title で伝える */
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }

  .icon-btn svg {
    width: 16px;
    height: 16px;
    pointer-events: none;
  }

  /* ---------- ボード・列 ----------
     ウィンドウが低いときは、列の最低限の高さ（ヘッダー＋カード一覧＋カード追加）が
     入りきらなくなる。overflow-y を hidden にするとその分がフッターの裏に隠れて
     「追加」ボタンなどが押せなくなるため、main は縦横ともスクロールできるようにする */
  main {
    padding: var(--sp-4);
    overflow: auto;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .board {
    display: flex;
    gap: var(--sp-3);
    min-width: calc(4 * 240px + 3 * var(--sp-3));
    flex: 1;
    min-height: 0;
  }

  /* 列の高さは .board（main の残り高さ）に合わせて伸縮する。
     カードが増えても列の外枠は伸びず、内側の .card-list だけがスクロールする */
  .column {
    flex: 1 1 0;
    min-width: 240px;
    background: var(--column);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  /* 列ヘッダーとカード追加領域はスクロールさせない固定部分 */
  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-2);
    min-height: 40px;
    padding: var(--sp-2) var(--sp-3);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .column-title {
    display: flex;
    align-items: center;
    gap: var(--sp-1);
    flex: 1;
    min-width: 0;
  }

  /* 列名は利用者が変更できるため、長い名前でも列からはみ出さないよう折り返す */
  .column-title h2 {
    font-size: 14px;
    font-weight: 600;
    line-height: 20px;
    margin: 0;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  /* 件数は補助情報。数字だけを控えめに右端へ置く */
  .column-count {
    flex-shrink: 0;
    min-width: 24px;
    font-size: 12px;
    color: var(--text-muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* 列名編集中は、フォームを列幅いっぱいに使うため件数を隠す */
  .column-header:has(.form) .column-count {
    display: none;
  }

  .column-label-edit-btn {
    opacity: 0.6;
  }

  .column-label-edit-btn:hover,
  .column-label-edit-btn:focus-visible {
    opacity: 1;
    color: var(--text);
    background: var(--hover-column);
  }

  .column-title .form {
    flex: 1;
    min-width: 0;
  }

  /* カード一覧のみを列内で独立スクロールさせる部分。
     カードが多い列でもスクロールバーは細く表示し、カードの操作領域を狭めない */
  .card-list {
    display: flex;
    flex-direction: column;
    gap: var(--sp-1);
    flex: 1;
    min-height: 60px;
    padding: var(--sp-2);
    overflow-y: auto;
    scrollbar-width: thin;
  }

  .card-list:empty::before {
    content: "カードがありません";
    padding: var(--sp-2) var(--sp-1);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ドロップ可能であることを示す状態。色だけに頼らず点線枠も併用する */
  .card-list.dropzone-active {
    background: var(--dropzone-bg);
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
  }

  /* ---------- カード ----------
     影は使わず、面の色（列より明るい）と 1px の境界線で区切る */
  .card {
    position: relative;
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--card-border);
    padding: var(--sp-2) var(--sp-3);
    cursor: grab;
  }

  .card[draggable="false"] {
    cursor: default;
  }

  .card:hover:not(:focus-within) {
    background: var(--card-hover);
    border-color: var(--border-hover);
  }

  /* キーボード操作・編集中は、カード全体の枠もフォーカス色にして現在地を示す */
  .card:has(:focus-visible) {
    border-color: var(--focus);
  }

  .card.dragging {
    opacity: var(--dragging-opacity);
    border-style: dashed;
    border-color: var(--border-strong);
  }

  /* ドラッグ中に挿入位置を示す線。カード間の隙間に疑似要素で描くため、
     カードの大きさは変わらず、境界付近でカードが上下に動いてちらつくこともない */
  .card.insert-before::before,
  .card.insert-after::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--accent);
    pointer-events: none;
  }

  .card.insert-before::before {
    top: -3px;
  }

  .card.insert-after::after {
    bottom: -3px;
  }

  /* 主情報: タイトル。URLなど途中で改行できない文字列でもカード内に収まるよう折り返す。
     削除ボタン（右上に絶対配置）と重ならないよう、右余白はタイトル行だけに持たせる */
  .card-title-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 0;
    padding: 0 var(--sp-5) 0 0;
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    line-height: 20px;
    color: var(--text);
    cursor: pointer;
    overflow-wrap: anywhere;
  }

  .card-title-btn:hover {
    text-decoration: underline;
  }

  /* 副情報: 補足テキスト */
  .card-note {
    margin: var(--sp-1) 0 0;
    font-size: 12px;
    line-height: 16px;
    color: var(--text-muted);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .card-delete {
    position: absolute;
    top: var(--sp-1);
    right: var(--sp-1);
  }

  .card-delete:hover,
  .card-delete:focus-visible {
    color: var(--on-danger);
    background: var(--danger-solid);
  }

  /* マウスで操作できる環境では、削除ボタンはカードにポインタを置く／フォーカスしたときだけ
     表示し、通常時は本文の視認性を優先する。タッチ操作の環境では常に表示する */
  @media (hover: hover) {
    .card-delete {
      opacity: 0;
    }

    .card:hover .card-delete,
    .card:focus-within .card-delete {
      opacity: 1;
    }
  }

  /* 編集フォームはカード内に表示する */
  .card .form {
    padding: var(--sp-1) 0;
  }

  /* ---------- カード追加領域（列の下部に固定） ---------- */
  .add-card-area {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
  }

  .add-card-trigger {
    display: block;
    width: 100%;
    height: 40px;
    padding: 0 var(--sp-3);
    text-align: left;
    font-size: 13px;
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }

  .add-card-trigger:hover {
    background: var(--hover-column);
    color: var(--text);
  }

  /* 展開したフォームは列の下部いっぱいに広げ、カードと同じ面の色にする */
  .add-card-form {
    padding: var(--sp-3);
    background: var(--card);
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  footer {
    padding: var(--sp-2) var(--sp-4) var(--sp-4);
    font-size: 12px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* ヘッダーが狭いときは、ツールバーを次の行へ回して左寄せにする */
  @media (max-width: 720px) {
    .toolbar {
      justify-content: flex-start;
    }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">
    <h1>iKanban</h1>
    <p class="subtitle">個人用の実用最小Kanban（v0.3.0）</p>
  </div>
  <div class="toolbar">
    <div class="btn-set" role="group" aria-label="バックアップ">
      <button type="button" class="btn" id="export-button">バックアップ出力</button>
      <button type="button" class="btn" id="restore-button">バックアップ復元</button>
      <button type="button" class="btn btn-undo" id="undo-restore-button" disabled title="取り消せる復元はありません">直前の復元を取り消す</button>
    </div>
    <input type="file" id="restore-file-input" class="visually-hidden" accept="application/json,.json">
    <div class="theme-switcher">
      <label for="theme-select">テーマ</label>
      <select id="theme-select">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="blue">Blue</option>
      </select>
    </div>
    <button type="button" class="btn btn-danger" id="reset-button">初期状態にリセット</button>
  </div>
</header>

<main>
  <div class="board" id="board">
    <section class="column" data-status="todo">
      <div class="column-header">
        <div class="column-title" data-status="todo"></div>
        <span class="column-count" data-count-for="todo">0</span>
      </div>
      <div class="card-list" data-status="todo"></div>
      <div class="add-card-area" data-status="todo"></div>
    </section>

    <section class="column" data-status="doing">
      <div class="column-header">
        <div class="column-title" data-status="doing"></div>
        <span class="column-count" data-count-for="doing">0</span>
      </div>
      <div class="card-list" data-status="doing"></div>
      <div class="add-card-area" data-status="doing"></div>
    </section>

    <section class="column" data-status="review">
      <div class="column-header">
        <div class="column-title" data-status="review"></div>
        <span class="column-count" data-count-for="review">0</span>
      </div>
      <div class="card-list" data-status="review"></div>
      <div class="add-card-area" data-status="review"></div>
    </section>

    <section class="column" data-status="done">
      <div class="column-header">
        <div class="column-title" data-status="done"></div>
        <span class="column-count" data-count-for="done">0</span>
      </div>
      <div class="card-list" data-status="done"></div>
      <div class="add-card-area" data-status="done"></div>
    </section>
  </div>
</main>

<footer>
  iKanban &mdash; カード・列の表示名・テーマ設定はこのブラウザの localStorage に保存されます。ブラウザのデータを削除すると内容も失われます。内容はヘッダーの「バックアップ出力」からJSONファイルへ書き出せます。
</footer>

<script>
  "use strict";

  var STATUSES = ["todo", "doing", "review", "done"];

  /* ============================================================
     localStorage の読み書き

     プライベートモードや容量超過では localStorage が例外を投げる。
     各所で try/catch を書くと扱いがばらつくため、ここに集約する。
     - 読込は失敗しても null を返す（呼び出し側は「未保存」と同じ扱いでよい）
     - 書込は成否を真偽値で返す（呼び出し側が利用者へ知らせられるようにする）
     ============================================================ */
  var Storage = (function () {
    function readText(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    function readJSON(key) {
      var raw = readText(key);
      if (!raw) {
        return null;
      }
      try {
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function writeText(key, value) {
      try {
        window.localStorage.setItem(key, value);
        return true;
      } catch (e) {
        console.warn("iKanban: 保存に失敗しました（" + key + "）", e);
        return false;
      }
    }

    function writeJSON(key, value) {
      return writeText(key, JSON.stringify(value));
    }

    function remove(key) {
      try {
        window.localStorage.removeItem(key);
      } catch (e) {
        // 削除できなくても実害は小さいため、そのまま続行する
      }
    }

    return {
      readText: readText,
      readJSON: readJSON,
      writeText: writeText,
      writeJSON: writeJSON,
      remove: remove
    };
  })();

  /* ============================================================
     ID生成
     ============================================================ */
  function generateId() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return window.crypto.randomUUID();
    }
    return "card-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  /* ============================================================
     初期サンプルデータ（初回起動時のみ使用）
     ============================================================ */
  function buildInitialBoard() {
    var cards = {};
    var columns = { todo: [], doing: [], review: [], done: [] };

    var sample = [
      { title: "申請フォームを整理する", note: "旧フォームの項目を洗い出す", status: "todo" },
      { title: "初期要件を整理する", note: "関係者へヒアリングした内容をまとめる", status: "todo" },
      { title: "マニュアルを更新する", note: "画面変更に合わせて手順を修正", status: "doing" },
      { title: "画面デザインを確認する", note: "配色とレイアウトのレビュー", status: "doing" },
      { title: "テスト結果をレビューする", note: "不具合の有無を確認", status: "review" },
      { title: "議事録を配布する", note: "前回MTGの内容を共有済み", status: "done" }
    ];

    sample.forEach(function (item) {
      var id = generateId();
      cards[id] = { title: item.title, note: item.note };
      columns[item.status].push(id);
    });

    return { cards: cards, columns: columns };
  }

  /* ============================================================
     データ保存・読込（カードとカード配置のみを対象とする）
     ============================================================ */
  var BoardStore = (function () {
    var STORAGE_KEY = "ikanban.board.v1";

    // 破損データの退避先。復元前バックアップと同じく固定の1キーで、
    // 退避のたびに上書きする（世代を残すと、保存容量が足りない状況で
    // 使えないコピーだけが際限なく溜まってしまうため）。
    var CORRUPTED_KEY = "ikanban.board.v1.corrupted";

    // 描画に必要な形（タイトルを持つオブジェクト）かを確認する。
    // 補足（note）は任意項目なので、無くても妥当なカードとして扱う。
    function isValidCard(card) {
      return !!card && typeof card === "object" && typeof card.title === "string";
    }

    // 4列すべてがID配列として揃っていて、参照先のカードが実在し、かつ
    // 描画できる形になっているかを確認する。一部の列だけ欠損したデータや、
    // 中身が壊れたカードをここで弾き、描画時のエラー（画面が真っ白になる）を防ぐ。
    function isValidBoard(data) {
      if (!data || typeof data.cards !== "object" || data.cards === null) {
        return false;
      }
      if (!data.columns || typeof data.columns !== "object") {
        return false;
      }
      return STATUSES.every(function (status) {
        var ids = data.columns[status];
        return Array.isArray(ids) && ids.every(function (id) {
          return Object.prototype.hasOwnProperty.call(data.cards, id) && isValidCard(data.cards[id]);
        });
      });
    }

    function load() {
      var raw = Storage.readText(STORAGE_KEY);
      if (!raw) {
        var initial = buildInitialBoard();
        save(initial);
        return initial;
      }

      var parsed = null;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        parsed = null;
      }

      if (isValidBoard(parsed)) {
        return parsed;
      }

      var recovered = buildInitialBoard();
      if (Storage.writeText(CORRUPTED_KEY, raw)) {
        // 退避できた場合のみ、元データを初期データで上書きする
        save(recovered);
      } else {
        console.warn("iKanban: 破損データを退避できなかったため、保存データは上書きしていません。今回は初期データで表示します。");
      }
      return recovered;
    }

    function save(board) {
      return Storage.writeJSON(STORAGE_KEY, board);
    }

    return { load: load, save: save, isValidBoard: isValidBoard };
  })();

  /* ============================================================
     テーマ管理（保存先はBoardStoreと分離する）
     ============================================================ */
  var ThemeManager = (function () {
    var STORAGE_KEY = "ikanban.theme.v1";
    var DEFAULT_THEME = "light";
    var ALLOWED_THEMES = ["light", "dark", "blue"];
    var selectEl = null;

    function isValidTheme(theme) {
      return ALLOWED_THEMES.indexOf(theme) !== -1;
    }

    // 許可された3テーマ以外は初期値へフォールバックする。
    // 保存値が壊れていた場合、data-theme に不明な値が入りどのCSSブロックにも
    // 一致せず配色が変わらないままになる（＝切替が効かないように見える）ため、
    // ここで必ず既知の値へ寄せておく。
    function sanitizeTheme(theme) {
      return isValidTheme(theme) ? theme : DEFAULT_THEME;
    }

    // 画面への反映のみを行う。保存の成否に関わらず、選択した瞬間に必ず呼ばれる。
    function apply(theme) {
      document.documentElement.setAttribute("data-theme", theme);
    }

    // 現在のテーマは実際に適用されている値をそのまま返す。
    // 別途変数で覚えておくと、apply との食い違いが起こりうるため持たない。
    function getCurrent() {
      return document.documentElement.getAttribute("data-theme");
    }

    // 保存のみを行う。失敗してもその場の表示（apply）には影響させない。
    function save(theme) {
      return Storage.writeText(STORAGE_KEY, theme);
    }

    function load() {
      return sanitizeTheme(Storage.readText(STORAGE_KEY));
    }

    function init(el) {
      selectEl = el;
      var theme = load();
      apply(theme);
      selectEl.value = theme;

      selectEl.addEventListener("change", function () {
        var next = sanitizeTheme(selectEl.value);
        apply(next);
        if (!save(next)) {
          notifySaveFailure();
        }
      });
    }

    // バックアップ復元・取り消しでは、3種類の保存がすべて成功してから
    // 画面を切り替える。そのため保存と表示反映を別々に呼べるようにする。
    function setCurrent(theme) {
      var next = sanitizeTheme(theme);
      apply(next);
      if (selectEl) {
        selectEl.value = next;
      }
    }

    return {
      init: init,
      isValidTheme: isValidTheme,
      save: save,
      setCurrent: setCurrent,
      getCurrent: getCurrent
    };
  })();

  /* ============================================================
     列表示名（内部ID todo/doing/review/done は固定。表示名のみ変更可能）
     ============================================================ */
  var ColumnLabels = (function () {
    var STORAGE_KEY = "ikanban.columnLabels.v1";
    var DEFAULT_LABELS = { todo: "未着手", doing: "作業中", review: "確認待ち", done: "完了" };

    function isValidLabels(data) {
      if (!data || typeof data !== "object") {
        return false;
      }
      return STATUSES.every(function (status) {
        return typeof data[status] === "string" && data[status].trim() !== "";
      });
    }

    // 保存値の一部が欠けたり壊れていても、使える列だけ採用し残りは既定値で
    // 補う。テーマ（全体を初期値へフォールバック）と違い、列名は列ごとに
    // 独立した値なので、部分的な復旧の方が利用者の設定を活かせる。
    function sanitize(data) {
      var result = {};
      STATUSES.forEach(function (status) {
        var value = data && data[status];
        result[status] = (typeof value === "string" && value.trim() !== "") ? value.trim() : DEFAULT_LABELS[status];
      });
      return result;
    }

    // 未保存（null）でも sanitize が全列を既定値で埋めるため、分岐は不要。
    function load() {
      return sanitize(Storage.readJSON(STORAGE_KEY));
    }

    function save(labels) {
      return Storage.writeJSON(STORAGE_KEY, labels);
    }

    return { load: load, save: save, sanitize: sanitize, isValidLabels: isValidLabels };
  })();

  /* ============================================================
     アプリ状態（メモリ上の現在値。BoardStore / ColumnLabels の内容を保持する）
     ============================================================ */
  var state = null;
  var columnLabels = null;

  // 保存できなかったことに気づかないまま操作を続けると、再読み込みで内容が
  // 失われてしまう。ただし操作のたびに知らせても邪魔になるだけなので、
  // ページを開いている間に一度だけ伝える。
  var saveFailureNotified = false;

  function notifySaveFailure() {
    if (saveFailureNotified) return;
    saveFailureNotified = true;
    window.alert(
      "変更をこのブラウザに保存できませんでした。\n" +
      "操作はこのまま続けられますが、ページを再読み込みすると変更が失われる可能性があります。\n" +
      "ブラウザの保存容量やプライベートモードの設定をご確認ください。"
    );
  }

  function persist() {
    if (!BoardStore.save(state)) {
      notifySaveFailure();
    }
  }

  // カードが現在どの列にあるかを返す（見つからない場合は null）
  function findStatusOf(id) {
    for (var i = 0; i < STATUSES.length; i++) {
      if (state.columns[STATUSES[i]].indexOf(id) !== -1) {
        return STATUSES[i];
      }
    }
    return null;
  }

  /* ============================================================
     カード操作（追加・編集・削除）
     ============================================================ */
  // title / note は入力フォーム側でトリムと必須チェックを済ませてから渡す。
  var CardActions = (function () {
    function addCard(status, title, note) {
      var id = generateId();
      state.cards[id] = { title: title, note: note };
      state.columns[status].push(id);
      persist();
      Renderer.appendCard(status, id);
    }

    function editCard(id, title, note) {
      state.cards[id] = { title: title, note: note };
      persist();
      Renderer.refreshCard(id);
    }

    function deleteCard(id) {
      var status = findStatusOf(id);
      if (status === null) {
        return;
      }
      var list = state.columns[status];
      list.splice(list.indexOf(id), 1);
      delete state.cards[id];
      persist();
      Renderer.removeCard(status, id);
    }

    return { addCard: addCard, editCard: editCard, deleteCard: deleteCard };
  })();

  /* ============================================================
     描画

     画面全体を描き直す renderAll は、起動時・リセット・バックアップ復元など
     ボードの内容がまるごと入れ替わるときだけに使う。
     カード1枚の追加・編集・削除・移動では、変化した箇所だけを更新する。
     全体を描き直すと、開いたままのカード編集フォームが別の操作をした拍子に
     消えて入力途中の内容が失われるため（例：カードAを編集中に別の列でカードを
     追加すると、Aの編集内容が消える）。

     state.columns の並び順とカード一覧のDOMの並び順は常に一致させる。
     ドロップ位置の判定はDOM側の並びを見て行うため、この一致が前提になる。
     ============================================================ */
  var Renderer = (function () {
    function listOf(status) {
      return document.querySelector('.card-list[data-status="' + status + '"]');
    }

    // アイコンだけのボタン（列名編集・カード削除）に使う線画アイコン。
    // 外部の画像やフォントに依存しないよう、パスをここに持つ。
    var ICON_PATHS = {
      edit: "M2 14l1-4 8-8 3 3-8 8-4 1zM9.5 3.5l3 3",
      close: "M3.5 3.5l9 9M12.5 3.5l-9 9"
    };

    function buildIconButton(className, iconName, label) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "icon-btn " + className;
      btn.setAttribute("aria-label", label);
      btn.title = label;

      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 16 16");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "1.25");
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", ICON_PATHS[iconName]);
      svg.appendChild(path);
      btn.appendChild(svg);
      return btn;
    }

    // 件数は保存対象である state から数える。DOMの子要素数から数えると、
    // 描画対象の要素が見つからなかった場合に保存内容と表示がずれてしまう。
    function updateCount(status) {
      document.querySelector('[data-count-for="' + status + '"]').textContent =
        String(state.columns[status].length);
    }

    function renderAll() {
      STATUSES.forEach(renderColumn);
    }

    function renderColumn(status) {
      var list = listOf(status);
      list.innerHTML = "";

      // 参照先のカードが実在することは保存データの検証で保証済みなので、
      // ここでは間引かずにそのまま並べる（間引くとDOMとstateの並びがずれる）
      state.columns[status].forEach(function (id) {
        list.appendChild(buildCardElement(id, state.cards[id]));
      });

      updateCount(status);
    }

    // 追加したカードは列の末尾に入る。カードが多い列では画面外になり
    // 「追加できていない」ように見えるため、末尾までスクロールして見せる。
    function appendCard(status, id) {
      var list = listOf(status);
      list.appendChild(buildCardElement(id, state.cards[id]));
      updateCount(status);
      list.scrollTop = list.scrollHeight;
    }

    function removeCard(status, id) {
      var el = document.getElementById(id);
      if (el) {
        el.remove();
      }
      updateCount(status);
    }

    // 編集フォームを閉じ、更新後の内容で表示に戻す。
    // キーボードで保存した場合に操作の続きを見失わないよう、タイトルへフォーカスを戻す
    function refreshCard(id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.draggable = true;
      renderCardDisplay(el, id, state.cards[id]);
      el.querySelector(".card-title-btn").focus();
    }

    // index は移動後の state.columns[newStatus] における位置。
    // 先に元の位置から取り除いてから挿入するため、そのまま同じ位置に入る。
    function moveCardTo(id, oldStatus, newStatus, index) {
      var el = document.getElementById(id);
      if (!el) return;

      var list = listOf(newStatus);
      el.remove();
      list.insertBefore(el, list.children[index] || null);

      updateCount(oldStatus);
      updateCount(newStatus);
    }

    // カードがどの列にあるかは state.columns が持つため、要素側には持たせない
    function buildCardElement(id, card) {
      var el = document.createElement("div");
      el.className = "card";
      el.draggable = true;
      el.id = id;
      renderCardDisplay(el, id, card);
      return el;
    }

    function renderCardDisplay(el, id, card) {
      el.innerHTML = "";

      var titleBtn = document.createElement("button");
      titleBtn.type = "button";
      titleBtn.className = "card-title-btn";
      titleBtn.textContent = card.title;
      titleBtn.setAttribute("aria-label", "カードを編集: " + card.title);
      titleBtn.addEventListener("click", function () {
        renderCardEditForm(el, id, card);
      });
      el.appendChild(titleBtn);

      if (card.note) {
        var note = document.createElement("p");
        note.className = "card-note";
        note.textContent = card.note;
        el.appendChild(note);
      }

      var deleteBtn = buildIconButton("card-delete", "close", "このカードを削除: " + card.title);
      deleteBtn.addEventListener("click", function () {
        if (window.confirm("このカードを削除しますか？\n「" + card.title + "」")) {
          CardActions.deleteCard(id);
        }
      });
      el.appendChild(deleteBtn);
    }

    // カードの入力フォーム（追加用・編集用）を組み立てる。
    // 両者の違いは「ラベルを見せるか」「ボタンの文言」「保存時の処理」だけなので、
    // 組み立て自体はここに1つだけ置く。
    // 戻り値の form を呼び出し側が好きな場所に入れ、titleInput / noteInput で
    // 追加後のクリアやフォーカス移動を行う。
    function buildCardForm(config) {
      var form = document.createElement("form");
      form.className = config.className;

      var titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.id = config.idPrefix + "-title";
      titleInput.required = true;
      titleInput.value = config.title;

      var noteInput = document.createElement("textarea");
      noteInput.id = config.idPrefix + "-note";
      noteInput.value = config.note;

      var actions = document.createElement("div");
      actions.className = "form-actions";

      var cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "btn btn-ghost";
      cancelBtn.textContent = config.cancelLabel;
      cancelBtn.addEventListener("click", config.onCancel);

      var submitBtn = document.createElement("button");
      submitBtn.type = "submit";
      submitBtn.className = "btn btn-primary";
      submitBtn.textContent = config.submitLabel;

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        // 空白だけのタイトルは登録しない。入力欄をトリム後の値へ揃えたうえで
        // ブラウザ標準の必須チェックを出すことで、「押しても何も起きない」状態を防ぐ。
        titleInput.value = titleInput.value.trim();
        if (!titleInput.value) {
          titleInput.reportValidity();
          return;
        }
        config.onSubmit(titleInput.value, noteInput.value.trim());
      });

      form.addEventListener("keydown", onEscapeCancel(config.onCancel));

      actions.appendChild(cancelBtn);
      actions.appendChild(submitBtn);
      form.appendChild(buildField(titleInput, config.titleLabel));
      form.appendChild(buildField(noteInput, config.noteLabel));
      form.appendChild(actions);

      return { form: form, titleInput: titleInput, noteInput: noteInput };
    }

    // ラベル付きの入力欄。カード追加・カード編集・列名編集で同じ見た目にそろえる。
    function buildField(inputEl, labelText) {
      var field = document.createElement("div");
      field.className = "field";

      var label = document.createElement("label");
      label.setAttribute("for", inputEl.id);
      label.textContent = labelText;

      field.appendChild(label);
      field.appendChild(inputEl);
      return field;
    }

    // Escキーでフォームを閉じる（3種類のフォームで共通）。
    // 日本語入力の変換中のEscは変換の取り消しなので、フォームは閉じない。
    function onEscapeCancel(onCancel) {
      return function (event) {
        if (event.key === "Escape" && !event.isComposing) {
          event.preventDefault();
          onCancel();
        }
      };
    }

    function renderCardEditForm(el, id, card) {
      el.innerHTML = "";
      el.draggable = false;

      var fields = buildCardForm({
        className: "form",
        idPrefix: "edit-" + id,
        titleLabel: "タイトル（必須）",
        noteLabel: "補足",
        title: card.title,
        note: card.note || "",
        submitLabel: "保存",
        cancelLabel: "キャンセル",
        onSubmit: function (title, note) {
          CardActions.editCard(id, title, note);
        },
        onCancel: function () {
          el.draggable = true;
          renderCardDisplay(el, id, card);
          el.querySelector(".card-title-btn").focus();
        }
      });

      el.appendChild(fields.form);
      fields.titleInput.focus();
    }

    // 「+ カードを追加」の領域はカードの内容に依存しないため、
    // カードの再描画では作り直さない。入力途中のフォームが
    // 他の操作（別カードの追加・移動など）で消えるのを防ぐ。
    function renderAddCardArea(status) {
      var area = document.querySelector('.add-card-area[data-status="' + status + '"]');
      area.innerHTML = "";

      var trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "add-card-trigger";
      trigger.textContent = "+ カードを追加";
      trigger.addEventListener("click", function () {
        renderAddCardForm(area, status);
      });
      area.appendChild(trigger);
    }

    function renderAddCardForm(area, status) {
      area.innerHTML = "";

      var fields = buildCardForm({
        className: "form add-card-form",
        idPrefix: "new-" + status,
        titleLabel: "タイトル（必須）",
        noteLabel: "補足",
        title: "",
        note: "",
        submitLabel: "追加",
        cancelLabel: "閉じる",
        // 追加後もフォームを開いたままにし、続けて何枚でも登録できるようにする
        onSubmit: function (title, note) {
          CardActions.addCard(status, title, note);
          fields.titleInput.value = "";
          fields.noteInput.value = "";
          fields.titleInput.focus();
        },
        onCancel: function () {
          renderAddCardArea(status);
          area.querySelector(".add-card-trigger").focus();
        }
      });

      area.appendChild(fields.form);
      fields.titleInput.focus();
    }

    return {
      renderAll: renderAll,
      renderAddCardArea: renderAddCardArea,
      buildField: buildField,
      onEscapeCancel: onEscapeCancel,
      buildIconButton: buildIconButton,
      appendCard: appendCard,
      removeCard: removeCard,
      refreshCard: refreshCard,
      moveCardTo: moveCardTo
    };
  })();

  /* ============================================================
     列名編集UI（列ヘッダーの表示名クリック→編集。内部IDは変更しない）
     ============================================================ */
  var ColumnLabelEditor = (function () {
    function buildDisplay(status) {
      var frag = document.createDocumentFragment();

      var h2 = document.createElement("h2");
      h2.textContent = columnLabels[status];

      var editBtn = Renderer.buildIconButton("column-label-edit-btn", "edit", "列名を編集: " + columnLabels[status]);
      editBtn.addEventListener("click", function () {
        startEdit(status);
      });

      frag.appendChild(h2);
      frag.appendChild(editBtn);
      return frag;
    }

    function titleElOf(status) {
      return document.querySelector('.column-title[data-status="' + status + '"]');
    }

    function showDisplay(status, restoreFocus) {
      var titleEl = titleElOf(status);
      titleEl.innerHTML = "";
      titleEl.appendChild(buildDisplay(status));
      if (restoreFocus) {
        titleEl.querySelector(".column-label-edit-btn").focus();
      }
    }

    function startEdit(status) {
      var titleEl = titleElOf(status);
      titleEl.innerHTML = "";

      // カード追加・編集フォームと同じ部品（.form / .field / .form-actions）で組み立てる
      var form = document.createElement("form");
      form.className = "form";

      var input = document.createElement("input");
      input.type = "text";
      input.id = "column-label-" + status;
      input.value = columnLabels[status];
      input.required = true;

      var actions = document.createElement("div");
      actions.className = "form-actions";

      var cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "btn btn-ghost";
      cancelBtn.textContent = "キャンセル";

      var saveBtn = document.createElement("button");
      saveBtn.type = "submit";
      saveBtn.className = "btn btn-primary";
      saveBtn.textContent = "保存";

      function cancel() {
        showDisplay(status, true);
      }
      cancelBtn.addEventListener("click", cancel);
      form.addEventListener("keydown", Renderer.onEscapeCancel(cancel));

      // 空白だけの列名は保存しない。カードのフォームと同じく、入力欄をトリム後の
      // 値へ揃えたうえでブラウザ標準の必須チェックを出すことで、「保存を押しても
      // 何も起きない」状態を防ぐ。
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        input.value = input.value.trim();
        if (!input.value) {
          input.reportValidity();
          return;
        }
        columnLabels[status] = input.value;
        if (!ColumnLabels.save(columnLabels)) {
          notifySaveFailure();
        }
        showDisplay(status, true);
      });

      actions.appendChild(cancelBtn);
      actions.appendChild(saveBtn);
      form.appendChild(Renderer.buildField(input, "列名（必須）"));
      form.appendChild(actions);
      titleEl.appendChild(form);

      input.focus();
      input.select();
    }

    function renderAll() {
      STATUSES.forEach(function (status) {
        showDisplay(status, false);
      });
    }

    return { renderAll: renderAll };
  })();

  /* ============================================================
     ドラッグ＆ドロップ（列間移動＋同一列内の並び替え）
     ============================================================ */
  var DragAndDrop = (function () {
    // ポインタが列の上下端からこの距離に入ったら、列内を自動スクロールする
    var AUTO_SCROLL_EDGE = 36;
    var AUTO_SCROLL_STEP = 12;

    // ドラッグ中の状態は、対象の要素を覚えておいて直接付け外しする。
    // 画面全体を検索して目印を消して回ると、dragover のたびにDOM全体を
    // 走査することになり、カードが増えるほど動きが重くなるため。
    var draggedEl = null;
    var markedCard = null; // 挿入線を表示しているカード
    var activeList = null; // ドロップ先として強調しているカード一覧

    function clearInsertMarker() {
      if (markedCard) {
        markedCard.classList.remove("insert-before", "insert-after");
        markedCard = null;
      }
    }

    function setActiveList(list) {
      if (activeList === list) return;
      if (activeList) {
        activeList.classList.remove("dropzone-active");
      }
      activeList = list;
      if (activeList) {
        activeList.classList.add("dropzone-active");
      }
    }

    function clearDragFeedback() {
      clearInsertMarker();
      setActiveList(null);
    }

    // リスト内のカードを上から見て、ポインタのY座標が入る位置を返す（0〜カード数）。
    // 表示順とstate.columnsの並び順は一致しているため、この値をそのまま
    // 挿入位置として使える。カードの隙間や余白にドロップされた場合も、
    // 見た目どおりの位置になる。
    function getInsertIndex(cards, clientY) {
      for (var i = 0; i < cards.length; i++) {
        var rect = cards[i].getBoundingClientRect();
        if (clientY < rect.top + rect.height / 2) {
          return i;
        }
      }
      return cards.length;
    }

    function showInsertMarker(cards, insertIndex) {
      clearInsertMarker();
      if (cards.length === 0) return;

      if (insertIndex < cards.length) {
        markedCard = cards[insertIndex];
        markedCard.classList.add("insert-before");
      } else {
        markedCard = cards[cards.length - 1];
        markedCard.classList.add("insert-after");
      }
    }

    // ドラッグ中はマウスホイールで列内をスクロールできないため、
    // カードの多い列では画面外の位置へ移動できなくなる。
    // 列の上下端に近づいたら少しずつスクロールして、その位置まで運べるようにする。
    function autoScroll(list, clientY) {
      var rect = list.getBoundingClientRect();
      if (clientY < rect.top + AUTO_SCROLL_EDGE) {
        list.scrollTop -= AUTO_SCROLL_STEP;
      } else if (clientY > rect.bottom - AUTO_SCROLL_EDGE) {
        list.scrollTop += AUTO_SCROLL_STEP;
      }
    }

    function handleDragStart(event) {
      var card = event.target.closest(".card");
      // 編集フォームを開いているカード（draggable=false）は対象外。
      // 入力欄の文字列を選択してドラッグした場合に、カードごと
      // 移動してしまい編集内容が失われるのを防ぐ。
      if (!card || !card.draggable) return;
      draggedEl = card;
      card.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", card.id);
    }

    function handleDragEnd() {
      if (draggedEl) {
        draggedEl.classList.remove("dragging");
        draggedEl = null;
      }
      clearDragFeedback();
    }

    function handleDragOver(event) {
      var list = event.target.closest(".card-list");
      if (!list || !draggedEl) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";

      setActiveList(list);
      autoScroll(list, event.clientY);

      // 自動スクロール後の位置で判定するため、カードの取得はここで1回だけ行う
      var cards = list.querySelectorAll(".card");
      showInsertMarker(cards, getInsertIndex(cards, event.clientY));
    }

    // 子要素をまたぐたびにleaveが発生するため、強調中の列から実際に
    // 出た場合のみ解除する
    function handleDragLeave(event) {
      if (!activeList || activeList.contains(event.relatedTarget)) return;
      clearDragFeedback();
    }

    function handleDrop(event) {
      var list = event.target.closest(".card-list");
      if (!list || !draggedEl) return;
      event.preventDefault();

      var id = draggedEl.id;
      var insertIndex = getInsertIndex(list.querySelectorAll(".card"), event.clientY);
      clearDragFeedback();
      moveCard(id, list.getAttribute("data-status"), insertIndex);
    }

    // insertIndex は「移動前の並び」での位置。移動元から取り除いた分だけ
    // 位置がずれるため、同じ列で前から後ろへ動かす場合は1つ手前に補正する。
    function moveCard(id, newStatus, insertIndex) {
      var oldStatus = findStatusOf(id);
      if (oldStatus === null) return;

      var from = state.columns[oldStatus];
      var oldIndex = from.indexOf(id);
      from.splice(oldIndex, 1);

      if (oldStatus === newStatus && oldIndex < insertIndex) {
        insertIndex -= 1;
      }

      var to = state.columns[newStatus];
      var index = Math.max(0, Math.min(insertIndex, to.length));
      to.splice(index, 0, id);

      persist();
      Renderer.moveCardTo(id, oldStatus, newStatus, index);
    }

    function init(boardEl) {
      boardEl.addEventListener("dragstart", handleDragStart);
      boardEl.addEventListener("dragend", handleDragEnd);
      boardEl.addEventListener("dragover", handleDragOver);
      boardEl.addEventListener("dragleave", handleDragLeave);
      boardEl.addEventListener("drop", handleDrop);
    }

    return { init: init };
  })();

  /* ============================================================
     リセット
     ============================================================ */
  function initResetButton(buttonEl) {
    buttonEl.addEventListener("click", function () {
      var confirmed = window.confirm(
        "Kanbanの内容を初期状態に戻します。追加・編集・削除・並び替えの内容は失われます。\n" +
        "列の表示名とテーマは変更されません。よろしいですか？"
      );
      if (!confirmed) return;
      state = buildInitialBoard();
      persist(); // 保存できなかった場合は persist が利用者へ知らせる
      Renderer.renderAll();
    });
  }

  /* ============================================================
     バックアップ出力・復元・直前の復元の取り消し
     ============================================================ */
  var BackupRestore = (function () {
    var APP_NAME = "iKanban";
    var CURRENT_FORMAT_VERSION = 1;
    var SUPPORTED_FORMAT_VERSIONS = [1];

    // 復元前の状態を退避しておくキー。復元を実行するたびにこのキー1つを
    // 上書きする（＝直前1世代分のみ保持。世代管理は行わない）。
    var BEFORE_RESTORE_KEY = "ikanban.beforeRestore.v1";

    var undoBtnEl = null;

    function pad2(n) {
      return n < 10 ? "0" + n : String(n);
    }

    // ファイル名用の日時文字列（例: 20260810-235959）。複数回出力しても
    // 上書きされず判別しやすいよう、ブラウザのローカル時刻を使う。
    function timestampForFilename(date) {
      return date.getFullYear() + pad2(date.getMonth() + 1) + pad2(date.getDate()) +
        "-" + pad2(date.getHours()) + pad2(date.getMinutes()) + pad2(date.getSeconds());
    }

    function buildExportData() {
      return {
        app: APP_NAME,
        formatVersion: CURRENT_FORMAT_VERSION,
        exportedAt: new Date().toISOString(),
        board: { cards: state.cards, columns: state.columns },
        columnLabels: columnLabels,
        theme: ThemeManager.getCurrent()
      };
    }

    function download() {
      var data = buildExportData();
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);

      var a = document.createElement("a");
      a.href = url;
      a.download = "ikanban-backup-" + timestampForFilename(new Date()) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      // クリック直後に同期的に解放すると、ブラウザによっては保存が
      // 始まる前にデータが消え、ダウンロードに失敗する。少し待ってから解放する。
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
    }

    // 復元データ（およびlocalStorageへ退避した「直前の復元前状態」）として
    // 妥当かを検証する。検証ロジックは各モジュールが持つものをそのまま
    // 再利用し、ここでは重複させない。
    function isValidImportData(data) {
      if (!data || typeof data !== "object") {
        return false;
      }
      if (data.app !== APP_NAME) {
        return false;
      }
      if (SUPPORTED_FORMAT_VERSIONS.indexOf(data.formatVersion) === -1) {
        return false;
      }
      if (!BoardStore.isValidBoard(data.board)) {
        return false;
      }
      if (!ColumnLabels.isValidLabels(data.columnLabels)) {
        return false;
      }
      if (!ThemeManager.isValidTheme(data.theme)) {
        return false;
      }
      return true;
    }

    // 取り消し可能な「直前の復元前状態」を読み込む。存在しない、または
    // 壊れている場合はnullを返す（取り消し不可として扱う）。
    function loadBeforeRestoreSnapshot() {
      var parsed = Storage.readJSON(BEFORE_RESTORE_KEY);
      return isValidImportData(parsed) ? parsed : null;
    }

    function updateUndoButtonState() {
      var available = loadBeforeRestoreSnapshot() !== null;
      undoBtnEl.disabled = !available;
      undoBtnEl.title = available ? "直前のバックアップ復元を取り消して、復元前の内容へ戻します" : "取り消せる復元はありません";
    }

    // ボード・列表示名・テーマの3つは、すべて保存できた場合にだけメモリ上の
    // 状態と画面へ反映する。途中で失敗したまま画面を切り替えると、一部だけが
    // 反映された表示と再読み込み後の内容が食い違うため、previousData を
    // 書き戻して呼び出し側に失敗を返す。
    function applyData(data, previousData) {
      var nextLabels = ColumnLabels.sanitize(data.columnLabels);
      var boardSaved = BoardStore.save(data.board);
      var labelsSaved = ColumnLabels.save(nextLabels);
      var themeSaved = ThemeManager.save(data.theme);

      if (!(boardSaved && labelsSaved && themeSaved)) {
        BoardStore.save(previousData.board);
        ColumnLabels.save(previousData.columnLabels);
        ThemeManager.save(previousData.theme);
        return false;
      }

      state = { cards: data.board.cards, columns: data.board.columns };
      columnLabels = nextLabels;
      ThemeManager.setCurrent(data.theme);

      Renderer.renderAll();
      STATUSES.forEach(Renderer.renderAddCardArea);
      ColumnLabelEditor.renderAll();

      return true;
    }

    function restore(data) {
      var beforeRestore = buildExportData();

      if (!Storage.writeJSON(BEFORE_RESTORE_KEY, beforeRestore)) {
        window.alert(
          "復元前バックアップの退避に失敗したため、復元を中止しました。\n" +
          "現在のKanbanの内容は変更していません。"
        );
        return;
      }

      if (applyData(data, beforeRestore)) {
        window.alert("復元が完了しました。");
      } else {
        // 復元しなかったことになるので、取り消し用の退避データも消しておく
        // （残すと「取り消せる復元」が無いのにボタンが有効になってしまう）。
        Storage.remove(BEFORE_RESTORE_KEY);
        window.alert(
          "復元内容を保存できなかったため、復元を中止して元の内容へ戻しました。\n" +
          "ブラウザの保存容量などをご確認のうえ、もう一度お試しください。"
        );
      }

      updateUndoButtonState();
    }

    function restoreFromFile(file) {
      var reader = new FileReader();

      reader.onload = function () {
        var parsed = null;
        try {
          parsed = JSON.parse(String(reader.result));
        } catch (e) {
          parsed = null;
        }

        if (!isValidImportData(parsed)) {
          window.alert(
            "復元に失敗しました。選択したファイルはiKanbanのバックアップ形式として認識できません。\n" +
            "現在のKanbanの内容は変更していません。"
          );
          return;
        }

        var confirmed = window.confirm(
          "現在のKanbanの内容を、選択したファイルの内容で置き換えます。\n" +
          "元に戻せるよう、現在の内容は復元前にこのブラウザ内へ退避されます（直前1回分のみ）。\n" +
          "よろしいですか？"
        );
        if (!confirmed) {
          return;
        }

        restore(parsed);
      };

      reader.onerror = function () {
        window.alert("ファイルの読み込みに失敗しました。現在のKanbanの内容は変更していません。");
      };

      reader.readAsText(file);
    }

    function undoLastRestore() {
      var snapshot = loadBeforeRestoreSnapshot();
      if (!snapshot) {
        window.alert("取り消せる復元はありません。");
        updateUndoButtonState();
        return;
      }

      var confirmed = window.confirm(
        "直前の「バックアップ復元」を取り消し、復元前の内容へ戻します。\n" +
        "取り消せるのはこの1回分のみです。よろしいですか？"
      );
      if (!confirmed) {
        return;
      }

      var beforeUndo = buildExportData();
      if (applyData(snapshot, beforeUndo)) {
        // 取り消しは直前1回分のみを対象とするため、使った退避データは消費する
        Storage.remove(BEFORE_RESTORE_KEY);
        window.alert("取り消しが完了しました。");
      } else {
        window.alert(
          "取り消し後の内容を保存できなかったため、取り消しを中止しました。\n" +
          "現在のKanbanの内容は変更していません。ブラウザの保存容量などをご確認ください。"
        );
      }
      updateUndoButtonState();
    }

    function init(exportBtn, restoreBtn, fileInput, undoBtn) {
      undoBtnEl = undoBtn;

      exportBtn.addEventListener("click", download);

      restoreBtn.addEventListener("click", function () {
        fileInput.click();
      });

      fileInput.addEventListener("change", function () {
        var file = fileInput.files && fileInput.files[0];
        fileInput.value = ""; // 同じファイルを選び直しても change が発火するようにする
        if (!file) return;
        restoreFromFile(file);
      });

      undoBtn.addEventListener("click", undoLastRestore);

      updateUndoButtonState();
    }

    return { init: init };
  })();

  /* ============================================================
     初期化
     ============================================================ */
  document.addEventListener("DOMContentLoaded", function () {
    ThemeManager.init(document.getElementById("theme-select"));
    state = BoardStore.load();
    columnLabels = ColumnLabels.load();
    ColumnLabelEditor.renderAll();
    Renderer.renderAll();
    STATUSES.forEach(Renderer.renderAddCardArea);
    DragAndDrop.init(document.getElementById("board"));
    initResetButton(document.getElementById("reset-button"));
    BackupRestore.init(
      document.getElementById("export-button"),
      document.getElementById("restore-button"),
      document.getElementById("restore-file-input"),
      document.getElementById("undo-restore-button")
    );
  });
</script>

</body>
</html>
