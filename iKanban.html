<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iKanban</title>
<style>
  /* ============================================================
     テーマ変数定義（iKanbanPilot.html と同じ考え方）
     - :root が既定（Light）テーマ
     - html[data-theme="xxx"] で各テーマの値を上書きする
     - レイアウトはテーマ間で共通。配色・境界線・影のみ変化させる
     ============================================================ */
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-alt: #eceef1;
    --text: #1b1f24;
    --text-muted: #5b6470;
    --border: #d0d5dc;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --danger: #b3261e;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
    --dragging-opacity: 0.5;
    --dropzone-bg: #e6edff;
    --insert-line: #2f6fed;
  }

  html[data-theme="dark"] {
    --bg: #14161a;
    --surface: #1f232a;
    --surface-alt: #262b33;
    --text: #eef1f5;
    --text-muted: #9aa3b0;
    --border: #363c46;
    --accent: #6d9bff;
    --accent-text: #10131a;
    --danger: #ff8a80;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    --dropzone-bg: #2a3550;
    --insert-line: #6d9bff;
  }

  html[data-theme="blue"] {
    --bg: #eaf2fb;
    --surface: #ffffff;
    --surface-alt: #dbe9fb;
    --text: #102540;
    --text-muted: #4a6483;
    --border: #b7d2f0;
    --accent: #0b5fcc;
    --accent-text: #ffffff;
    --danger: #a3271a;
    --shadow: 0 1px 2px rgba(11, 95, 204, 0.15);
    --dropzone-bg: #cfe3fb;
    --insert-line: #0b5fcc;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    margin: 0;
  }

  header p.subtitle {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--text-muted);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .theme-switcher {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .theme-switcher label {
    font-size: 13px;
    color: var(--text-muted);
  }

  .theme-switcher select {
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  button {
    font-family: inherit;
  }

  .btn {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }

  .btn:hover {
    border-color: var(--accent);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .btn-xs {
    font-size: 11.5px;
    padding: 3px 8px;
  }

  .btn:focus-visible,
  select:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  .card:focus-visible,
  .card-title-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  main {
    padding: 20px;
    overflow-x: auto;
    overflow-y: hidden;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .board {
    display: flex;
    gap: 16px;
    min-width: 960px;
    flex: 1;
    min-height: 0;
  }

  /* 列自体の高さは .board（main の残り高さ）に合わせて伸縮する。
     カードが増えても列の外枠は伸びず、内側の .card-list だけが
     スクロールする（下部で overflow-y: auto を指定） */
  .column {
    flex: 1 1 0;
    min-width: 240px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
  }

  /* ヘッダーとカード追加領域はスクロールさせない固定部分 */
  .column-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    padding: 4px 4px 12px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  .column-header h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
  }

  .column-title {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    min-width: 0;
  }

  /* 列名の編集ボタン。カード操作（追加・削除）より主張しないよう、
     通常時は控えめな不透明度にし、ホバー・フォーカス時のみ強調する */
  .column-label-edit-btn {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    line-height: 1;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    opacity: 0.55;
  }

  .column-label-edit-btn:hover,
  .column-label-edit-btn:focus-visible {
    opacity: 1;
    background: var(--surface);
  }

  .column-label-edit-form {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1 1 100%;
  }

  .column-label-input {
    font-family: inherit;
    font-size: 13px;
    padding: 3px 6px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    flex: 1 1 auto;
    min-width: 60px;
  }

  .column-count {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 9px;
    min-width: 22px;
    text-align: center;
  }

  /* カード一覧のみを列内で独立スクロールさせる部分。
     min-height を明示しておくことで、カードが増えても列全体を
     押し広げず、この領域内だけが縦スクロールになる */
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-height: 60px;
    border-radius: 8px;
    padding: 4px;
    overflow-y: auto;
    transition: background-color 0.12s ease;
  }

  /* ドロップ可能であることを示す状態。色だけに頼らず点線枠も併用する */
  .card-list.dropzone-active {
    background: var(--dropzone-bg);
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 30px 10px 12px;
    box-shadow: var(--shadow);
    cursor: grab;
  }

  .card.dragging {
    opacity: var(--dragging-opacity);
    border-style: dashed;
  }

  /* ドラッグ中に挿入位置を示す線。
     border で描くとカードの高さが変わり、境界付近でカードが上下に動いて
     ちらつくため、レイアウトに影響しない内側の影で描画する */
  .card.insert-before {
    box-shadow: var(--shadow), inset 0 3px 0 0 var(--insert-line);
  }

  .card.insert-after {
    box-shadow: var(--shadow), inset 0 -3px 0 0 var(--insert-line);
  }

  .card-title-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 0;
    margin: 0 0 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }

  .card-note {
    font-size: 12px;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .card-delete {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    line-height: 1;
    padding: 0;
    border-radius: 5px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
  }

  .card-delete:hover,
  .card-delete:focus-visible {
    color: var(--danger);
    border-color: var(--danger);
    background: var(--surface-alt);
  }

  .card-edit-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card-edit-form input,
  .card-edit-form textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    resize: vertical;
  }

  .card-edit-form textarea {
    min-height: 48px;
  }

  .card-edit-actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .add-card-area {
    margin-top: 8px;
    flex-shrink: 0;
  }

  .add-card-trigger {
    width: 100%;
    text-align: left;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }

  .add-card-trigger:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  .add-card-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }

  .add-card-form label {
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .add-card-form input,
  .add-card-form textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    resize: vertical;
  }

  .add-card-form textarea {
    min-height: 42px;
  }

  .add-card-actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  footer {
    padding: 12px 24px 24px;
    font-size: 11.5px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>iKanban</h1>
    <p class="subtitle">個人用の実用最小Kanban（v0.2.0）</p>
  </div>
  <div class="header-controls">
    <div class="header-actions">
      <button type="button" class="btn" id="reset-button">初期状態にリセット</button>
      <button type="button" class="btn" id="export-button">バックアップ出力</button>
      <button type="button" class="btn" id="restore-button">バックアップ復元</button>
      <input type="file" id="restore-file-input" class="visually-hidden" accept="application/json,.json">
    </div>
    <div class="theme-switcher">
      <label for="theme-select">テーマ</label>
      <select id="theme-select">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="blue">Blue</option>
      </select>
    </div>
  </div>
</header>

<main>
  <div class="board" id="board">
    <section class="column" data-status="todo">
      <div class="column-header">
        <span class="column-title" data-status="todo"></span>
        <span class="column-count" data-count-for="todo">0</span>
      </div>
      <div class="card-list" data-status="todo"></div>
      <div class="add-card-area" data-status="todo"></div>
    </section>

    <section class="column" data-status="doing">
      <div class="column-header">
        <span class="column-title" data-status="doing"></span>
        <span class="column-count" data-count-for="doing">0</span>
      </div>
      <div class="card-list" data-status="doing"></div>
      <div class="add-card-area" data-status="doing"></div>
    </section>

    <section class="column" data-status="review">
      <div class="column-header">
        <span class="column-title" data-status="review"></span>
        <span class="column-count" data-count-for="review">0</span>
      </div>
      <div class="card-list" data-status="review"></div>
      <div class="add-card-area" data-status="review"></div>
    </section>

    <section class="column" data-status="done">
      <div class="column-header">
        <span class="column-title" data-status="done"></span>
        <span class="column-count" data-count-for="done">0</span>
      </div>
      <div class="card-list" data-status="done"></div>
      <div class="add-card-area" data-status="done"></div>
    </section>
  </div>
</main>

<footer>
  iKanban &mdash; カード・列の表示名・テーマ設定はこのブラウザの localStorage に保存されます。ブラウザのデータを削除すると内容も失われます。内容はヘッダーの「バックアップ出力」からJSONファイルへ書き出せます。
</footer>

<script>
  "use strict";

  var STATUSES = ["todo", "doing", "review", "done"];

  /* ============================================================
     ID生成
     ============================================================ */
  function generateId() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return window.crypto.randomUUID();
    }
    return "card-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  /* ============================================================
     初期サンプルデータ（初回起動時のみ使用）
     ============================================================ */
  function buildInitialBoard() {
    var cards = {};
    var columns = { todo: [], doing: [], review: [], done: [] };

    var sample = [
      { title: "申請フォームを整理する", note: "旧フォームの項目を洗い出す", status: "todo" },
      { title: "初期要件を整理する", note: "関係者へヒアリングした内容をまとめる", status: "todo" },
      { title: "マニュアルを更新する", note: "画面変更に合わせて手順を修正", status: "doing" },
      { title: "画面デザインを確認する", note: "配色とレイアウトのレビュー", status: "doing" },
      { title: "テスト結果をレビューする", note: "不具合の有無を確認", status: "review" },
      { title: "議事録を配布する", note: "前回MTGの内容を共有済み", status: "done" }
    ];

    sample.forEach(function (item) {
      var id = generateId();
      cards[id] = { title: item.title, note: item.note };
      columns[item.status].push(id);
    });

    return { cards: cards, columns: columns };
  }

  /* ============================================================
     データ保存・読込（カードとカード配置のみを対象とする）
     ============================================================ */
  var BoardStore = (function () {
    var STORAGE_KEY = "ikanban.board.v1";

    // 4列すべてがID配列として揃っているか、cardsがオブジェクトかを確認する。
    // 一部の列だけ欠損したデータや、存在しないカードIDを参照するデータを
    // ここで弾き、描画時のエラーを防ぐ。
    function isValidBoard(data) {
      if (!data || typeof data.cards !== "object" || data.cards === null) {
        return false;
      }
      if (!data.columns || typeof data.columns !== "object") {
        return false;
      }
      var columnsValid = STATUSES.every(function (status) {
        return Array.isArray(data.columns[status]);
      });
      if (!columnsValid) {
        return false;
      }
      return STATUSES.every(function (status) {
        return data.columns[status].every(function (id) {
          return Object.prototype.hasOwnProperty.call(data.cards, id);
        });
      });
    }

    // 破損データを退避キーへ保存する。成功したかどうかを呼び出し側へ返す。
    function backupCorruptedData(raw) {
      try {
        var backupKey = STORAGE_KEY + ".corrupted." + Date.now();
        window.localStorage.setItem(backupKey, raw);
        return true;
      } catch (e) {
        console.warn("iKanban: 破損データの退避に失敗しました。", e);
        return false;
      }
    }

    function load() {
      var raw = null;
      try {
        raw = window.localStorage.getItem(STORAGE_KEY);
      } catch (e) {
        raw = null;
      }

      if (!raw) {
        var initial = buildInitialBoard();
        save(initial);
        return initial;
      }

      var parsed = null;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        parsed = null;
      }

      if (isValidBoard(parsed)) {
        return parsed;
      }

      var backedUp = backupCorruptedData(raw);
      var recovered = buildInitialBoard();
      if (backedUp) {
        // 退避に成功した場合のみ、元データを初期データで上書きする
        save(recovered);
      } else {
        console.warn("iKanban: 破損データを退避できなかったため、保存データは上書きしていません。今回は初期データで表示します。");
      }
      return recovered;
    }

    function save(board) {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(board));
      } catch (e) {
        console.warn("iKanban: 保存に失敗しました。変更が次回起動時に反映されない可能性があります。", e);
      }
    }

    function reset() {
      var initial = buildInitialBoard();
      save(initial);
      return initial;
    }

    return { load: load, save: save, reset: reset, isValidBoard: isValidBoard };
  })();

  /* ============================================================
     テーマ管理（保存先はBoardStoreと分離する）
     ============================================================ */
  var ThemeManager = (function () {
    var STORAGE_KEY = "ikanban.theme.v1";
    var DEFAULT_THEME = "light";
    var ALLOWED_THEMES = ["light", "dark", "blue"];
    var selectEl = null;
    var current = DEFAULT_THEME;

    function isValidTheme(theme) {
      return ALLOWED_THEMES.indexOf(theme) !== -1;
    }

    // 許可された3テーマ以外は初期値へフォールバックする。
    // 保存値が壊れていた場合、data-theme に不明な値が入りどのCSSブロックにも
    // 一致せず配色が変わらないままになる（＝切替が効かないように見える）ため、
    // ここで必ず既知の値へ寄せておく。
    function sanitizeTheme(theme) {
      return isValidTheme(theme) ? theme : DEFAULT_THEME;
    }

    // 画面への反映のみを行う。保存の成否に関わらず、選択した瞬間に必ず呼ばれる。
    function apply(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      current = theme;
    }

    // 保存のみを行う。失敗してもその場の表示（apply）には影響させない。
    function save(theme) {
      try {
        window.localStorage.setItem(STORAGE_KEY, theme);
      } catch (e) {
        console.warn("iKanban: テーマの保存に失敗しました。", e);
      }
    }

    function load() {
      try {
        var stored = window.localStorage.getItem(STORAGE_KEY);
        return stored ? sanitizeTheme(stored) : DEFAULT_THEME;
      } catch (e) {
        return DEFAULT_THEME;
      }
    }

    function init(el) {
      selectEl = el;
      var theme = load();
      apply(theme);
      selectEl.value = theme;

      selectEl.addEventListener("change", function () {
        var next = sanitizeTheme(selectEl.value);
        apply(next);
        save(next);
      });
    }

    // バックアップ復元時に外部からテーマを設定するための入口。
    // 表示・保存・セレクトボックスの選択状態を一括で揃える。
    function setAndPersist(theme) {
      var next = sanitizeTheme(theme);
      apply(next);
      save(next);
      if (selectEl) {
        selectEl.value = next;
      }
    }

    function getCurrent() {
      return current;
    }

    return { init: init, isValidTheme: isValidTheme, setAndPersist: setAndPersist, getCurrent: getCurrent };
  })();

  /* ============================================================
     列表示名（内部ID todo/doing/review/done は固定。表示名のみ変更可能）
     ============================================================ */
  var ColumnLabels = (function () {
    var STORAGE_KEY = "ikanban.columnLabels.v1";
    var DEFAULT_LABELS = { todo: "未着手", doing: "作業中", review: "確認待ち", done: "完了" };

    function cloneDefaults() {
      var result = {};
      STATUSES.forEach(function (status) {
        result[status] = DEFAULT_LABELS[status];
      });
      return result;
    }

    function isValidLabels(data) {
      if (!data || typeof data !== "object") {
        return false;
      }
      return STATUSES.every(function (status) {
        return typeof data[status] === "string" && data[status].trim() !== "";
      });
    }

    // 保存値の一部が欠けたり壊れていても、使える列だけ採用し残りは既定値で
    // 補う。テーマ（全体を初期値へフォールバック）と違い、列名は列ごとに
    // 独立した値なので、部分的な復旧の方が利用者の設定を活かせる。
    function sanitize(data) {
      var result = {};
      STATUSES.forEach(function (status) {
        var value = data && data[status];
        result[status] = (typeof value === "string" && value.trim() !== "") ? value.trim() : DEFAULT_LABELS[status];
      });
      return result;
    }

    function load() {
      try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return cloneDefaults();
        }
        return sanitize(JSON.parse(raw));
      } catch (e) {
        return cloneDefaults();
      }
    }

    function save(labels) {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(labels));
      } catch (e) {
        console.warn("iKanban: 列表示名の保存に失敗しました。", e);
      }
    }

    return { load: load, save: save, sanitize: sanitize, isValidLabels: isValidLabels };
  })();

  /* ============================================================
     アプリ状態（メモリ上の現在値。BoardStore / ColumnLabels の内容を保持する）
     ============================================================ */
  var state = null;
  var columnLabels = null;

  function persist() {
    BoardStore.save(state);
  }

  /* ============================================================
     カード操作（追加・編集・削除）
     ============================================================ */
  var CardActions = (function () {
    function addCard(status, title, note) {
      var trimmedTitle = title.trim();
      if (!trimmedTitle) {
        return false;
      }
      var id = generateId();
      state.cards[id] = { title: trimmedTitle, note: note.trim() };
      state.columns[status].push(id);
      persist();
      Renderer.renderAll();
      return true;
    }

    function editCard(id, title, note) {
      var trimmedTitle = title.trim();
      if (!trimmedTitle) {
        return false;
      }
      state.cards[id] = { title: trimmedTitle, note: note.trim() };
      persist();
      Renderer.renderAll();
      return true;
    }

    function deleteCard(id) {
      delete state.cards[id];
      STATUSES.forEach(function (status) {
        var list = state.columns[status];
        var index = list.indexOf(id);
        if (index !== -1) {
          list.splice(index, 1);
        }
      });
      persist();
      Renderer.renderAll();
    }

    return { addCard: addCard, editCard: editCard, deleteCard: deleteCard };
  })();

  /* ============================================================
     描画
     ============================================================ */
  var Renderer = (function () {
    function renderAll() {
      STATUSES.forEach(function (status) {
        renderColumn(status);
      });
    }

    // カードの再描画と件数表示は必ずセットで行う。
    // 件数は実際に描画したカード数から数えるため、画面と食い違うことがない。
    function renderColumn(status) {
      var list = document.querySelector('.card-list[data-status="' + status + '"]');
      list.innerHTML = "";

      var count = 0;
      state.columns[status].forEach(function (id) {
        var card = state.cards[id];
        if (card) {
          list.appendChild(buildCardElement(id, card, status));
          count += 1;
        }
      });

      document.querySelector('[data-count-for="' + status + '"]').textContent = String(count);
    }

    function buildCardElement(id, card, status) {
      var el = document.createElement("div");
      el.className = "card";
      el.draggable = true;
      el.id = id;
      el.setAttribute("data-status", status);
      renderCardDisplay(el, id, card);
      return el;
    }

    function renderCardDisplay(el, id, card) {
      el.innerHTML = "";

      var titleBtn = document.createElement("button");
      titleBtn.type = "button";
      titleBtn.className = "card-title-btn";
      titleBtn.textContent = card.title;
      titleBtn.setAttribute("aria-label", "カードを編集: " + card.title);
      titleBtn.addEventListener("click", function () {
        renderCardEditForm(el, id, card);
      });
      el.appendChild(titleBtn);

      if (card.note) {
        var note = document.createElement("p");
        note.className = "card-note";
        note.textContent = card.note;
        el.appendChild(note);
      }

      var deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "card-delete";
      deleteBtn.setAttribute("aria-label", "このカードを削除: " + card.title);
      deleteBtn.textContent = "×";
      deleteBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        if (window.confirm("このカードを削除しますか？\n「" + card.title + "」")) {
          CardActions.deleteCard(id);
        }
      });
      el.appendChild(deleteBtn);
    }

    function renderCardEditForm(el, id, card) {
      el.innerHTML = "";
      el.draggable = false;

      var form = document.createElement("form");
      form.className = "card-edit-form";

      var titleLabel = document.createElement("label");
      titleLabel.className = "visually-hidden";
      titleLabel.setAttribute("for", "edit-title-" + id);
      titleLabel.textContent = "タイトル";

      var titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.id = "edit-title-" + id;
      titleInput.value = card.title;
      titleInput.required = true;

      var noteLabel = document.createElement("label");
      noteLabel.className = "visually-hidden";
      noteLabel.setAttribute("for", "edit-note-" + id);
      noteLabel.textContent = "補足";

      var noteInput = document.createElement("textarea");
      noteInput.id = "edit-note-" + id;
      noteInput.value = card.note || "";

      var actions = document.createElement("div");
      actions.className = "card-edit-actions";

      var cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "btn";
      cancelBtn.textContent = "キャンセル";
      cancelBtn.addEventListener("click", function () {
        el.draggable = true;
        renderCardDisplay(el, id, card);
      });

      var saveBtn = document.createElement("button");
      saveBtn.type = "submit";
      saveBtn.className = "btn btn-primary";
      saveBtn.textContent = "保存";

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        CardActions.editCard(id, titleInput.value, noteInput.value);
      });

      actions.appendChild(cancelBtn);
      actions.appendChild(saveBtn);
      form.appendChild(titleLabel);
      form.appendChild(titleInput);
      form.appendChild(noteLabel);
      form.appendChild(noteInput);
      form.appendChild(actions);
      el.appendChild(form);

      titleInput.focus();
    }

    // 「+ カードを追加」の領域はカードの内容に依存しないため、
    // カードの再描画では作り直さない。入力途中のフォームが
    // 他の操作（別カードの追加・移動など）で消えるのを防ぐ。
    function renderAddCardArea(status) {
      var area = document.querySelector('.add-card-area[data-status="' + status + '"]');
      area.innerHTML = "";

      var trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "add-card-trigger";
      trigger.textContent = "+ カードを追加";
      trigger.addEventListener("click", function () {
        renderAddCardForm(area, status);
      });
      area.appendChild(trigger);
    }

    function renderAddCardForm(area, status) {
      area.innerHTML = "";

      var form = document.createElement("form");
      form.className = "add-card-form";

      var titleLabel = document.createElement("label");
      titleLabel.setAttribute("for", "new-title-" + status);
      titleLabel.textContent = "タイトル（必須）";

      var titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.id = "new-title-" + status;
      titleInput.required = true;

      var noteLabel = document.createElement("label");
      noteLabel.setAttribute("for", "new-note-" + status);
      noteLabel.textContent = "補足";

      var noteInput = document.createElement("textarea");
      noteInput.id = "new-note-" + status;

      var actions = document.createElement("div");
      actions.className = "add-card-actions";

      var cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "btn";
      cancelBtn.textContent = "閉じる";
      cancelBtn.addEventListener("click", function () {
        renderAddCardArea(status);
      });

      var addBtn = document.createElement("button");
      addBtn.type = "submit";
      addBtn.className = "btn btn-primary";
      addBtn.textContent = "追加";

      // 追加後もフォームを開いたままにし、続けて入力できるようにする
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (CardActions.addCard(status, titleInput.value, noteInput.value)) {
          titleInput.value = "";
          noteInput.value = "";
        }
        titleInput.focus();
      });

      actions.appendChild(cancelBtn);
      actions.appendChild(addBtn);
      form.appendChild(titleLabel);
      form.appendChild(titleInput);
      form.appendChild(noteLabel);
      form.appendChild(noteInput);
      form.appendChild(actions);
      area.appendChild(form);

      titleInput.focus();
    }

    return { renderAll: renderAll, renderAddCardArea: renderAddCardArea };
  })();

  /* ============================================================
     列名編集UI（列ヘッダーの表示名クリック→編集。内部IDは変更しない）
     ============================================================ */
  var ColumnLabelEditor = (function () {
    function buildDisplay(status) {
      var frag = document.createDocumentFragment();

      var h2 = document.createElement("h2");
      h2.textContent = columnLabels[status];

      var editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "column-label-edit-btn";
      editBtn.setAttribute("aria-label", "列名を編集: " + columnLabels[status]);
      editBtn.textContent = "✎";
      editBtn.addEventListener("click", function () {
        startEdit(status);
      });

      frag.appendChild(h2);
      frag.appendChild(editBtn);
      return frag;
    }

    function titleElOf(status) {
      return document.querySelector('.column-title[data-status="' + status + '"]');
    }

    function showDisplay(status) {
      var titleEl = titleElOf(status);
      titleEl.innerHTML = "";
      titleEl.appendChild(buildDisplay(status));
    }

    function startEdit(status) {
      var titleEl = titleElOf(status);
      titleEl.innerHTML = "";

      var form = document.createElement("form");
      form.className = "column-label-edit-form";

      var label = document.createElement("label");
      label.className = "visually-hidden";
      label.setAttribute("for", "column-label-" + status);
      label.textContent = "列名";

      var input = document.createElement("input");
      input.type = "text";
      input.id = "column-label-" + status;
      input.className = "column-label-input";
      input.value = columnLabels[status];
      input.required = true;

      var saveBtn = document.createElement("button");
      saveBtn.type = "submit";
      saveBtn.className = "btn btn-xs btn-primary";
      saveBtn.textContent = "保存";

      var cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "btn btn-xs";
      cancelBtn.textContent = "キャンセル";
      cancelBtn.addEventListener("click", function () {
        showDisplay(status);
      });

      // 空文字だけの列名は保存しない（inputのrequiredでブラウザが送信を止める）
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var trimmed = input.value.trim();
        if (!trimmed) {
          return;
        }
        columnLabels[status] = trimmed;
        ColumnLabels.save(columnLabels);
        showDisplay(status);
      });

      form.appendChild(label);
      form.appendChild(input);
      form.appendChild(saveBtn);
      form.appendChild(cancelBtn);
      titleEl.appendChild(form);

      input.focus();
      input.select();
    }

    // 初期化時、およびバックアップ復元後に全列の表示を現在のcolumnLabelsへ揃える
    function renderAll() {
      STATUSES.forEach(showDisplay);
    }

    return { renderAll: renderAll };
  })();

  /* ============================================================
     ドラッグ＆ドロップ（列間移動＋同一列内の並び替え）
     ============================================================ */
  var DragAndDrop = (function () {
    var draggedId = null;

    function clearInsertMarkers() {
      document.querySelectorAll(".card.insert-before, .card.insert-after").forEach(function (el) {
        el.classList.remove("insert-before", "insert-after");
      });
    }

    function clearDropzones() {
      document.querySelectorAll(".card-list.dropzone-active").forEach(function (el) {
        el.classList.remove("dropzone-active");
      });
    }

    // リスト内のカードを上から見て、ポインタのY座標が入る位置を返す（0〜カード数）。
    // 表示順とstate.columnsの並び順は一致しているため、この値をそのまま
    // 挿入位置として使える。カードの隙間や余白にドロップされた場合も、
    // 見た目どおりの位置になる。
    function getInsertIndex(list, clientY) {
      var cards = list.querySelectorAll(".card");
      for (var i = 0; i < cards.length; i++) {
        var rect = cards[i].getBoundingClientRect();
        if (clientY < rect.top + rect.height / 2) {
          return i;
        }
      }
      return cards.length;
    }

    // 挿入位置を示す線を、対象のカードの上辺または下辺に表示する
    function showInsertMarker(list, insertIndex) {
      clearInsertMarkers();
      var cards = list.querySelectorAll(".card");
      if (cards.length === 0) return;

      if (insertIndex < cards.length) {
        cards[insertIndex].classList.add("insert-before");
      } else {
        cards[cards.length - 1].classList.add("insert-after");
      }
    }

    function handleDragStart(event) {
      var card = event.target.closest(".card");
      // 編集フォームを開いているカード（draggable=false）は対象外。
      // 入力欄の文字列を選択してドラッグした場合に、カードごと
      // 移動してしまい編集内容が失われるのを防ぐ。
      if (!card || !card.draggable) return;
      draggedId = card.id;
      card.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", card.id);
    }

    function handleDragEnd(event) {
      var card = event.target.closest(".card");
      if (card) {
        card.classList.remove("dragging");
      }
      draggedId = null;
      clearInsertMarkers();
      clearDropzones();
    }

    function handleDragOver(event) {
      var list = event.target.closest(".card-list");
      if (!list || !draggedId) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      list.classList.add("dropzone-active");

      showInsertMarker(list, getInsertIndex(list, event.clientY));
    }

    function handleDragLeave(event) {
      var list = event.target.closest(".card-list");
      if (!list) return;
      if (!list.contains(event.relatedTarget)) {
        list.classList.remove("dropzone-active");
      }
    }

    function handleDrop(event) {
      var list = event.target.closest(".card-list");
      if (!list || !draggedId) return;
      event.preventDefault();

      moveCard(draggedId, list.getAttribute("data-status"), getInsertIndex(list, event.clientY));

      clearInsertMarkers();
      clearDropzones();
    }

    function findStatusOf(id) {
      for (var i = 0; i < STATUSES.length; i++) {
        if (state.columns[STATUSES[i]].indexOf(id) !== -1) {
          return STATUSES[i];
        }
      }
      return null;
    }

    // insertIndex は「移動前の並び」での位置。移動元から取り除いた分だけ
    // 位置がずれるため、同じ列で前から後ろへ動かす場合は1つ手前に補正する。
    function moveCard(id, newStatus, insertIndex) {
      var oldStatus = findStatusOf(id);
      if (oldStatus === null) return;

      var oldIndex = state.columns[oldStatus].indexOf(id);
      state.columns[oldStatus].splice(oldIndex, 1);

      if (oldStatus === newStatus && oldIndex < insertIndex) {
        insertIndex -= 1;
      }

      var target = state.columns[newStatus];
      target.splice(Math.max(0, Math.min(insertIndex, target.length)), 0, id);

      persist();
      Renderer.renderAll();
    }

    function init(boardEl) {
      boardEl.addEventListener("dragstart", handleDragStart);
      boardEl.addEventListener("dragend", handleDragEnd);
      boardEl.addEventListener("dragover", handleDragOver);
      boardEl.addEventListener("dragleave", handleDragLeave);
      boardEl.addEventListener("drop", handleDrop);
    }

    return { init: init };
  })();

  /* ============================================================
     リセット
     ============================================================ */
  function initResetButton(buttonEl) {
    buttonEl.addEventListener("click", function () {
      var confirmed = window.confirm(
        "Kanbanの内容を初期状態に戻します。追加・編集・削除・並び替えの内容は失われます。\n" +
        "列の表示名とテーマは変更されません。よろしいですか？"
      );
      if (!confirmed) return;
      state = BoardStore.reset();
      Renderer.renderAll();
    });
  }

  /* ============================================================
     バックアップ出力・復元
     ============================================================ */
  var BackupRestore = (function () {
    var APP_NAME = "iKanban";
    var CURRENT_FORMAT_VERSION = 1;
    var SUPPORTED_FORMAT_VERSIONS = [1];

    function pad2(n) {
      return n < 10 ? "0" + n : String(n);
    }

    // ファイル名用の日時文字列（例: 20260810-235959）。複数回出力しても
    // 上書きされず判別しやすいよう、ブラウザのローカル時刻を使う。
    function timestampForFilename(date) {
      return date.getFullYear() + pad2(date.getMonth() + 1) + pad2(date.getDate()) +
        "-" + pad2(date.getHours()) + pad2(date.getMinutes()) + pad2(date.getSeconds());
    }

    function buildExportData() {
      return {
        app: APP_NAME,
        formatVersion: CURRENT_FORMAT_VERSION,
        exportedAt: new Date().toISOString(),
        board: { cards: state.cards, columns: state.columns },
        columnLabels: columnLabels,
        theme: ThemeManager.getCurrent()
      };
    }

    function download() {
      var data = buildExportData();
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);

      var a = document.createElement("a");
      a.href = url;
      a.download = "ikanban-backup-" + timestampForFilename(new Date()) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 復元データとして妥当かを検証する。検証ロジックは各モジュールが
    // 持つものをそのまま再利用し、ここでは重複させない。
    function isValidImportData(data) {
      if (!data || typeof data !== "object") {
        return false;
      }
      if (data.app !== APP_NAME) {
        return false;
      }
      if (SUPPORTED_FORMAT_VERSIONS.indexOf(data.formatVersion) === -1) {
        return false;
      }
      if (!BoardStore.isValidBoard(data.board)) {
        return false;
      }
      if (!ColumnLabels.isValidLabels(data.columnLabels)) {
        return false;
      }
      if (!ThemeManager.isValidTheme(data.theme)) {
        return false;
      }
      return true;
    }

    // 復元直前の状態を退避する。失敗した場合は呼び出し側で復元処理そのものを
    // 中止させ、「復元で現在データを不可逆に失う」ことがないようにする。
    function snapshotBeforeRestore() {
      try {
        var key = "ikanban.board.v1.before-restore." + Date.now();
        window.localStorage.setItem(key, JSON.stringify(buildExportData()));
        return true;
      } catch (e) {
        console.warn("iKanban: 復元前バックアップの退避に失敗しました。", e);
        return false;
      }
    }

    function applyImportedData(data) {
      state = { cards: data.board.cards, columns: data.board.columns };
      columnLabels = ColumnLabels.sanitize(data.columnLabels);

      BoardStore.save(state);
      ColumnLabels.save(columnLabels);
      ThemeManager.setAndPersist(data.theme);

      Renderer.renderAll();
      STATUSES.forEach(Renderer.renderAddCardArea);
      ColumnLabelEditor.renderAll();
    }

    function restoreFromFile(file) {
      var reader = new FileReader();

      reader.onload = function () {
        var parsed = null;
        try {
          parsed = JSON.parse(String(reader.result));
        } catch (e) {
          parsed = null;
        }

        if (!isValidImportData(parsed)) {
          window.alert(
            "復元に失敗しました。選択したファイルはiKanbanのバックアップ形式として認識できません。\n" +
            "現在のKanbanの内容は変更していません。"
          );
          return;
        }

        var confirmed = window.confirm(
          "現在のKanbanの内容を、選択したファイルの内容で置き換えます。\n" +
          "元に戻せるよう、現在の内容は復元前にこのブラウザ内へ退避されます。\n" +
          "よろしいですか？"
        );
        if (!confirmed) {
          return;
        }

        if (!snapshotBeforeRestore()) {
          window.alert(
            "復元前バックアップの退避に失敗したため、復元を中止しました。\n" +
            "現在のKanbanの内容は変更していません。"
          );
          return;
        }

        applyImportedData(parsed);
        window.alert("復元が完了しました。");
      };

      reader.onerror = function () {
        window.alert("ファイルの読み込みに失敗しました。現在のKanbanの内容は変更していません。");
      };

      reader.readAsText(file);
    }

    function init(exportBtn, restoreBtn, fileInput) {
      exportBtn.addEventListener("click", download);

      restoreBtn.addEventListener("click", function () {
        fileInput.click();
      });

      fileInput.addEventListener("change", function () {
        var file = fileInput.files && fileInput.files[0];
        fileInput.value = ""; // 同じファイルを選び直しても change が発火するようにする
        if (!file) return;
        restoreFromFile(file);
      });
    }

    return { init: init };
  })();

  /* ============================================================
     初期化
     ============================================================ */
  document.addEventListener("DOMContentLoaded", function () {
    ThemeManager.init(document.getElementById("theme-select"));
    state = BoardStore.load();
    columnLabels = ColumnLabels.load();
    ColumnLabelEditor.renderAll();
    Renderer.renderAll();
    STATUSES.forEach(Renderer.renderAddCardArea);
    DragAndDrop.init(document.getElementById("board"));
    initResetButton(document.getElementById("reset-button"));
    BackupRestore.init(
      document.getElementById("export-button"),
      document.getElementById("restore-button"),
      document.getElementById("restore-file-input")
    );
  });
</script>

</body>
</html>
